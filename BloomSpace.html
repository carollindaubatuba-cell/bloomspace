<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BloomSpace — your whole life, in one calm place</title>
<meta name="description" content="BloomSpace is an interactive life management system: dashboard, calendar, tasks, habits, goals, journal, budget, meals, fitness, home and more.">
<meta name="theme-color" content="#FBF7F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..700&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --cream:#FBF7F1; --shell:#F4EEE5; --blush:#DFA8AE; --blush-deep:#C88A92;
  --sage:#8CA383; --sage-deep:#6F8768; --lav:#B0A5D4; --lav-deep:#8E82BA;
  --peach:#EFC7AE; --ink:#3A3340; --ink-soft:#6B6270; --ink-faint:#9C93A3;
  --accent:var(--blush); --accent-deep:var(--blush-deep);
  --card:rgba(255,255,255,.72); --card-solid:#FFFDFA; --line:rgba(58,51,64,.10);
  --line-strong:rgba(58,51,64,.18);
  --shadow:0 1px 2px rgba(58,51,64,.04), 0 8px 28px -12px rgba(58,51,64,.14);
  --shadow-lift:0 2px 6px rgba(58,51,64,.06), 0 24px 48px -20px rgba(58,51,64,.24);
  --r-xs:8px; --r-sm:12px; --r-md:18px; --r-lg:26px; --r-xl:34px; --r-pill:999px;
  --display:'Fraunces',Georgia,serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --ok:#7A9B6E; --warn:#D9A05B; --bad:#C97D82; --info:#8E9FC4;
  --sp:4px; --ease:cubic-bezier(.32,.72,0,1);
}
html[data-theme="dark"]{
  --cream:#191521; --shell:#221D2C; --ink:#EFE9F2; --ink-soft:#B6ACBF; --ink-faint:#8A8095;
  --card:rgba(45,38,58,.62); --card-solid:#241E2F; --line:rgba(239,233,242,.10);
  --line-strong:rgba(239,233,242,.20);
  --blush:#E4B0B6; --blush-deep:#F0C4C9; --sage:#9DB694; --sage-deep:#B4CBAB;
  --lav:#BEB3E4; --lav-deep:#D2C9F2; --peach:#F0CDB6;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.55);
  --shadow-lift:0 2px 8px rgba(0,0,0,.35), 0 28px 56px -22px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--body); color:var(--ink); background:var(--cream);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.55;
  overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.6;
  background:
    radial-gradient(680px 480px at 8% -6%, color-mix(in srgb, var(--blush) 34%, transparent), transparent 70%),
    radial-gradient(600px 520px at 98% 4%, color-mix(in srgb, var(--lav) 30%, transparent), transparent 70%),
    radial-gradient(700px 600px at 50% 108%, color-mix(in srgb, var(--sage) 26%, transparent), transparent 72%);
}
h1,h2,h3,h4,.display{font-family:var(--display); font-weight:500; letter-spacing:-.015em; line-height:1.15; font-variation-settings:'SOFT' 40,'WONK' 1}
.eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint)}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--lav-deep); outline-offset:2px; border-radius:6px}
::selection{background:color-mix(in srgb,var(--blush) 45%,transparent)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid transparent;background-clip:content-box}

/* ============ LAYOUT ============ */
#app{position:relative;z-index:1;display:flex;min-height:100vh}
#sidebar{
  width:246px; flex:0 0 246px; padding:22px 14px 14px; position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; gap:6px; overflow-y:auto;
  border-right:1px solid var(--line);
  background:var(--card-solid);
  transform:translateZ(0); backface-visibility:hidden; -webkit-backface-visibility:hidden;
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand-mark{width:34px;height:34px;flex:0 0 34px}
.brand-name{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.02em}
.brand-sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.nav-group{margin:12px 0 4px;padding:0 12px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);
  font-size:14px;font-weight:500;color:var(--ink-soft);width:100%;text-align:left;
  transition:background .2s var(--ease), color .2s, transform .2s var(--ease);
}
.nav-item:hover{background:color-mix(in srgb,var(--card-solid) 80%,transparent);color:var(--ink)}
.nav-item.active{background:var(--card-solid);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.nav-item.active .ni{transform:scale(1.08)}
.ni{width:18px;text-align:center;font-size:15px;transition:transform .3s var(--ease)}
.nav-spacer{flex:1}

#main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:14px 26px;border-bottom:1px solid var(--line);
  backdrop-filter:blur(22px) saturate(1.3);
  background:color-mix(in srgb,var(--cream) 78%,transparent);
}
.topbar h1{font-size:24px}
.topbar-date{font-size:12.5px;color:var(--ink-faint);font-weight:500}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.page{padding:26px;max-width:1420px;width:100%;animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#menu-btn{display:none}

/* ============ PRIMITIVES ============ */
.card{
  background:var(--card); backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid var(--line); border-radius:var(--r-lg); padding:20px;
  box-shadow:var(--shadow); position:relative; overflow:hidden;
  transition:box-shadow .35s var(--ease), transform .35s var(--ease);
}
.card.solid{background:var(--card-solid);backdrop-filter:none}
.card.hover:hover{box-shadow:var(--shadow-lift);transform:translateY(-2px)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-size:17px}
.card-h .sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.muted{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.tnum{font-variant-numeric:tabular-nums}
.center{text-align:center}
.mt{margin-top:14px}
.hide{display:none!important}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;
  background:var(--card-solid);border:1px solid var(--line-strong);color:var(--ink);
  transition:transform .2s var(--ease), box-shadow .25s, background .25s, border-color .25s;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--ink);color:var(--cream);border-color:transparent}
.btn.accent{background:var(--accent);color:#fff;border-color:transparent}
html[data-theme="dark"] .btn.accent{color:#241E2F}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:color-mix(in srgb,var(--card-solid) 85%,transparent);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.icon{padding:0;width:36px;height:36px;flex:0 0 36px;border-radius:var(--r-pill)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.input,.select,.ta{
  width:100%;padding:10px 13px;border-radius:var(--r-sm);border:1px solid var(--line-strong);
  background:var(--card-solid);font-size:14px;transition:border-color .2s, box-shadow .2s;
}
.input:focus,.select:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 22%,transparent)}
.ta{resize:vertical;min-height:88px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}
.search{position:relative}
.search .input{padding-left:36px}
.search::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:17px}

.chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--accent) 16%,transparent);
  color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);
}
.chip.tab{cursor:pointer;background:transparent;border-color:var(--line);color:var(--ink-soft);padding:6px 14px;font-size:12.5px}
.chip.tab:hover{border-color:var(--line-strong);color:var(--ink)}
.chip.tab.on{background:var(--ink);color:var(--cream);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--accent)}
.tabs{display:flex;gap:7px;flex-wrap:wrap}

.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--lav));transition:width .7s var(--ease)}

.check{
  width:21px;height:21px;flex:0 0 21px;border-radius:7px;border:1.8px solid var(--line-strong);
  display:grid;place-items:center;transition:all .25s var(--ease);color:transparent;font-size:12px;
}
.check:hover{border-color:var(--accent);transform:scale(1.08)}
.check.on{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .check.on{color:#241E2F}
.check.on.sage{background:var(--sage);border-color:var(--sage)}

.list-item{
  display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:var(--r-md);
  background:color-mix(in srgb,var(--card-solid) 70%,transparent);border:1px solid var(--line);
  transition:transform .2s var(--ease),box-shadow .2s,opacity .3s;
}
.list-item:hover{box-shadow:var(--shadow);transform:translateX(2px)}
.list-item.done{opacity:.5}
.list-item.done .li-t{text-decoration:line-through}
.li-t{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;gap:8px}
.x{color:var(--ink-faint);font-size:15px;line-height:1;padding:5px;border-radius:8px;transition:.2s}
.x:hover{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}

.empty{padding:34px 18px;text-align:center;color:var(--ink-faint)}
.empty .e-ico{font-size:30px;opacity:.5;display:block;margin-bottom:8px}
.empty h4{font-size:16px;color:var(--ink-soft);margin-bottom:4px}

.stat{padding:16px 18px;border-radius:var(--r-md);background:var(--card-solid);border:1px solid var(--line)}
.stat .v{font-family:var(--display);font-size:29px;font-weight:600;line-height:1}
.stat .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:6px}

/* modal */
.scrim{position:fixed;inset:0;z-index:200;background:color-mix(in srgb,var(--ink) 34%,transparent);backdrop-filter:blur(7px);display:grid;place-items:center;padding:18px;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--card-solid);
  border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;box-shadow:var(--shadow-lift);
  animation:pop .4s var(--ease);
}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.modal h2{font-size:22px;margin-bottom:4px}
.modal-b{display:flex;flex-direction:column;gap:14px;margin:20px 0}
.modal-f{display:flex;gap:10px;justify-content:flex-end}

/* toast */
#toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  padding:11px 20px;border-radius:var(--r-pill);background:var(--ink);color:var(--cream);
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lift);animation:tin .4s var(--ease);
}
@keyframes tin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* fab */
#fab{
  position:fixed;bottom:26px;right:26px;z-index:90;width:58px;height:58px;border-radius:50%;
  background:var(--ink);color:var(--cream);font-size:25px;display:grid;place-items:center;
  box-shadow:var(--shadow-lift);transition:transform .3s var(--ease);
}
#fab:hover{transform:rotate(90deg) scale(1.06)}

/* floral */
.petal-bg{position:absolute;pointer-events:none;opacity:.16;right:-22px;top:-22px;width:120px;height:120px}
.floral-strip{display:flex;gap:6px;justify-content:center;opacity:.4;margin:6px 0}

/* progress ring */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset 1s var(--ease)}
.ring .lbl{position:absolute;text-align:center;line-height:1.1}
.ring .lbl b{font-family:var(--display);font-size:20px;font-weight:600;display:block}

/* heatmap */
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3.5px}
.heat i{aspect-ratio:1;border-radius:3.5px;background:var(--line);transition:transform .2s}
.heat i:hover{transform:scale(1.3)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--sage) 30%,transparent)}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--sage) 55%,transparent)}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--sage) 78%,transparent)}
.heat i[data-l="4"]{background:var(--sage-deep)}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.cal-dow{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);text-align:center;padding-bottom:6px}
.cal-cell{
  min-height:104px;min-width:0;border-radius:var(--r-md);border:1px solid var(--line);padding:7px 8px;
  background:color-mix(in srgb,var(--card-solid) 55%,transparent);display:flex;flex-direction:column;gap:4px;
  transition:border-color .2s,background .2s;
}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.out{opacity:.34}
.cal-cell.today{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.cal-cell.drop{border-color:var(--lav-deep);border-style:dashed;background:color-mix(in srgb,var(--lav) 14%,transparent)}
.cal-n{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.cal-cell.today .cal-n{color:var(--accent-deep)}
.ev{
  font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;cursor:grab;
  background:color-mix(in srgb,var(--ec,var(--accent)) 20%,transparent);
  border-left:2.5px solid var(--ec,var(--accent));
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ev:active{cursor:grabbing}
.ev.dragging{opacity:.4}
.tl{display:grid;grid-template-columns:56px 1fr;gap:0}
.tl-h{height:56px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);padding-top:3px;font-weight:600}
.tl-s{height:56px;border-top:1px solid var(--line);position:relative;transition:background .2s}
.tl-s:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.tl-ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 9px;font-size:11.5px;font-weight:600;overflow:hidden;
  background:color-mix(in srgb,var(--ec,var(--accent)) 24%,transparent);border-left:3px solid var(--ec,var(--accent));z-index:2}

/* kanban */
.kb{display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.kb-col{background:color-mix(in srgb,var(--shell) 60%,transparent);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px;min-height:220px;display:flex;flex-direction:column;gap:9px}
.kb-col.drop{border-color:var(--lav-deep);border-style:dashed}
.kb-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.kb-card{background:var(--card-solid);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;cursor:grab;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.kb-card:hover{transform:translateY(-2px)}
.kb-card.dragging{opacity:.4}

/* mood + water */
.mood-row{display:flex;gap:7px;justify-content:space-between}
.mood-b{flex:1;aspect-ratio:1;border-radius:var(--r-md);font-size:23px;display:grid;place-items:center;background:color-mix(in srgb,var(--card-solid) 65%,transparent);border:1.6px solid var(--line);transition:all .25s var(--ease)}
.mood-b:hover{transform:translateY(-3px) scale(1.05)}
.mood-b.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,transparent);transform:scale(1.06)}
.water-row{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:26px;height:34px;border-radius:5px 5px 11px 11px;border:1.8px solid var(--line-strong);position:relative;overflow:hidden;transition:.25s}
.glass.on{border-color:var(--info)}
.glass.on::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--info) 55%,transparent),var(--info));animation:fill .45s var(--ease)}
@keyframes fill{from{transform:translateY(100%)}to{transform:none}}

/* vision board */
.vb{columns:3;column-gap:14px}
.vb > div{break-inside:avoid;margin-bottom:14px;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--card-solid);box-shadow:var(--shadow)}
.vb img{width:100%;display:block}
.vb .vb-c{padding:12px}

/* badges */
.badge{width:74px;text-align:center;opacity:.32;transition:.35s var(--ease)}
.badge.earned{opacity:1;transform:scale(1.03)}
.badge .b-ico{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:var(--line);border:1.6px solid var(--line-strong)}
.badge.earned .b-ico{background:linear-gradient(140deg,color-mix(in srgb,var(--blush) 45%,transparent),color-mix(in srgb,var(--lav) 45%,transparent));border-color:var(--accent)}

/* focus */
#focus-full{position:fixed;inset:0;z-index:250;background:var(--cream);display:none;place-items:center;text-align:center}
#focus-full.on{display:grid}
.timer-n{font-family:var(--display);font-size:clamp(76px,17vw,190px);font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}

/* charts */
.chart{display:flex;align-items:flex-end;gap:8px;height:150px}
.chart > div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.chart b{width:100%;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--lav) 70%,transparent));min-height:3px;transition:height .8s var(--ease)}
.donut{width:158px;height:158px;flex:0 0 158px}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend .lg .sp{flex:1}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);padding:0 10px 9px}
table.t td{padding:11px 10px;border-top:1px solid var(--line)}
table.t tr[data-editrow]{cursor:pointer}
table.t tr[data-editrow]:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.list-item[data-editrow]{cursor:pointer}
.list-item[data-editrow]:hover{background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:10px}

<script>
/* =====================================================================
   BLOOMSPACE — core engine
   Single-file. All data lives in this browser (localStorage), autosaved.
   ===================================================================== */
const KEY='bloomspace.v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const today=()=>iso(new Date());
const parseISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const fmt=(s,o={month:'short',day:'numeric'})=>parseISO(s).toLocaleDateString(undefined,o);
const money=n=>(D.settings.currency||'$')+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const startOfWeek=s=>addDays(s,-((parseISO(s).getDay()+6)%7));
const relDay=s=>{const t=today();if(s===t)return'Today';if(s===addDays(t,1))return'Tomorrow';if(s===addDays(t,-1))return'Yesterday';return fmt(s,{weekday:'short',month:'short',day:'numeric'})};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);

/* ---------- default data ---------- */
const SEED={
  version:1,
  settings:{appName:'BloomSpace',theme:'light',accent:'blush',currency:'$',firstDay:1,
    homepage:'dashboard',city:'',reminders:true,toasts:true,waterGoal:8,stepGoal:8000,sleepGoal:8,
    pomodoro:25,shortBreak:5,longBreak:15,
    widgets:{agenda:1,priorities:1,bloom:1,appointments:1,calendar:1,week:1,habits:1,mood:1,water:1,quote:1,focus:1,weather:1,goals:1,journal:1}},
  categories:[
    {id:'c1',name:'Personal',color:'#DFA8AE'},{id:'c2',name:'Work',color:'#B0A5D4'},
    {id:'c3',name:'Health',color:'#8CA383'},{id:'c4',name:'Home',color:'#EFC7AE'},
    {id:'c5',name:'Family',color:'#8E9FC4'}],
  events:[],tasks:[],habits:[],habitLog:{},goals:[],vision:[],journal:[],
  moods:{},water:{},sleep:{},steps:{},weight:[],measures:[],workouts:[],
  income:[],expenses:[],bills:[],savings:[],
  meals:{},grocery:[],pantry:[],recipes:[],
  chores:[],rooms:[],docs:[],maint:[],subs:[],warranty:[],contacts:[],
  projects:[],shopping:[],trips:[],gifts:[],partyEvents:[],
  notes:[],focusLog:[],badges:[],
  createdAt:new Date().toISOString()
};

/* ---------- store + autosave ---------- */
let D=load();
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return structuredClone(SEED);
    const p=JSON.parse(raw);
    return deepFill(p,structuredClone(SEED));
  }catch(e){console.warn('Load failed, starting fresh',e);return structuredClone(SEED)}
}
function deepFill(obj,def){
  if(obj===null||obj===undefined)return def;
  if(Array.isArray(def))return Array.isArray(obj)?obj:def;
  if(typeof def==='object'){const o={...def};for(const k in def)o[k]=deepFill(obj[k],def[k]);
    for(const k in obj)if(!(k in o))o[k]=obj[k];return o}
  return obj;
}
let saveT,saving=false;
function save(){
  clearTimeout(saveT); flagSaving();
  saveT=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(D));flagSaved()}
    catch(e){flagSaved('Storage full — export a backup');toast('Could not save: browser storage is full. Export a backup in Settings.')}
  },350);
}
function flagSaving(){const d=$('#save-dot'),l=$('#save-label');if(!d)return;d.style.background='var(--warn)';l.textContent='Saving…'}
function flagSaved(msg){const d=$('#save-dot'),l=$('#save-label');if(!d)return;d.style.background='var(--sage)';l.textContent=msg||'All changes saved'}
window.addEventListener('beforeunload',()=>{clearTimeout(saveT);try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}});

/* mutate helper: change data, save, re-render current page */
function mut(fn){fn();save();render()}

/* ---------- toast ---------- */
function toast(msg,ms=2600){
  if(D.settings&&D.settings.toasts===false)return;
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  $('#toasts').append(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(10px)';setTimeout(()=>t.remove(),300)},ms);
}

/* ---------- modal ---------- */
function modal({title,sub,body,confirm='Save',onConfirm,wide,danger}){
  const s=document.createElement('div');s.className='scrim';
  s.innerHTML=`<div class="modal" role="dialog" aria-modal="true" ${wide?'style="max-width:760px"':''}>
    <h2>${esc(title)}</h2>${sub?`<div class="sm muted">${esc(sub)}</div>`:''}
    <div class="modal-b">${body}</div>
    <div class="modal-f"><button class="btn ghost" data-x>Cancel</button>
    ${onConfirm?`<button class="btn ${danger?'':'primary'}" data-ok ${danger?'style="background:var(--bad);color:#fff;border-color:transparent"':''}>${esc(confirm)}</button>`:''}</div></div>`;
  document.body.append(s);
  const close=()=>{s.style.opacity='0';setTimeout(()=>s.remove(),200)};
  s.addEventListener('click',e=>{if(e.target===s)close()});
  $('[data-x]',s).onclick=close;
  const ok=$('[data-ok]',s);
  if(ok)ok.onclick=()=>{if(onConfirm(s)!==false)close()};
  const f=$('input,textarea,select',s);if(f)setTimeout(()=>f.focus(),60);
  s.addEventListener('keydown',e=>{if(e.key==='Escape')close();
    if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&ok){e.preventDefault();ok.click()}});
  return {el:s,close};
}
function confirmDialog(title,sub,onYes,label='Delete'){
  modal({title,sub,body:'',confirm:label,danger:true,onConfirm:()=>{onYes()}});
}
function field(label,html){return `<div class="field"><label>${esc(label)}</label>${html}</div>`}
function catOptions(sel){return D.categories.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('')}
function catColor(id){return (D.categories.find(c=>c.id===id)||{}).color||'var(--accent)'}
function catName(id){return (D.categories.find(c=>c.id===id)||{}).name||'Uncategorised'}

/* ---------- routing ---------- */
const NAV=[
  {g:'Daily'},
  {id:'dashboard',n:'Today',i:'✿'},
  {id:'calendar',n:'Calendar',i:'📅'},
  {id:'tasks',n:'To-do lists',i:'✓'},
  {id:'focus',n:'Focus mode',i:'⏱'},
  {g:'Growth'},
  {id:'habits',n:'Habits',i:'🌱'},
  {id:'goals',n:'Goals',i:'🎯'},
  {id:'journal',n:'Journal',i:'📖'},
  {id:'fitness',n:'Fitness',i:'💪'},
  {g:'Life admin'},
  {id:'budget',n:'Budget',i:'💰'},
  {id:'meals',n:'Meal planner',i:'🍽'},
  {id:'cleaning',n:'Cleaning',i:'🏡'},
  {id:'home',n:'Home & docs',i:'🗂'},
  {g:'Create'},
  {id:'projects',n:'Projects',i:'📌'},
  {id:'notes',n:'Notes',i:'📝'},
  {id:'assistant',n:'Assistant',i:'✨'},
  {id:'settings',n:'Settings',i:'⚙'},
];
let route=D.settings.homepage||'dashboard';
let tab={};
function go(id){
  route=id; if(location.hash.slice(1)!==id)location.hash=id;
  $('#sidebar').classList.remove('open'); $('#nav-scrim')?.remove();
  window.scrollTo({top:0,behavior:'instant'}); render();
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==route){route=h;render()}});

function buildNav(){
  $('#nav').innerHTML=NAV.map(x=>x.g?`<div class="nav-group eyebrow">${x.g}</div>`
    :`<button class="nav-item" data-go="${x.id}"><span class="ni">${x.i}</span>${x.n}</button>`).join('');
}
const PAGES={};
function render(){
  const p=PAGES[route]||PAGES.dashboard;
  $('#page-title').textContent=p.title;
  $('#page-sub').textContent=typeof p.sub==='function'?p.sub():(p.sub||'');
  $('#view').innerHTML=p.render();
  $$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.go===route));
  p.after?.();
  $('#brand-name').textContent=D.settings.appName;
  document.title=`${D.settings.appName} — ${p.title}`;
}

/* ---------- global click delegation ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(g.dataset.go);return}
  const t=e.target.closest('[data-tab]');
  if(t){tab[t.dataset.tabkey]=t.dataset.tab;render();return}
});
</script>
<script>
/* =====================================================================
   SHARED LOGIC
   ===================================================================== */
const MOODS=[{e:'😞',l:'Rough',v:1},{e:'😕',l:'Low',v:2},{e:'😐',l:'Okay',v:3},{e:'🙂',l:'Good',v:4},{e:'😄',l:'Great',v:5}];
const PRIOS={high:{l:'High',c:'var(--bad)'},med:{l:'Medium',c:'var(--warn)'},low:{l:'Low',c:'var(--info)'}};
const QUOTES=[
 ['Bloom where you are planted.','Proverb'],
 ['Little by little, a little becomes a lot.','Tanzanian proverb'],
 ['You do not have to do everything today. Just the next thing.',''],
 ['The days are long but the decades are short.',''],
 ['Almost everything works again if you unplug it for a while — including you.','Anne Lamott'],
 ['How we spend our days is how we spend our lives.','Annie Dillard'],
 ['Progress, not perfection.',''],
 ['Tend to small things and the big things follow.',''],
 ['Rest is part of the work.',''],
 ['Start where you are. Use what you have.','Arthur Ashe'],
 ['A slow yes is better than a fast no you regret.',''],
 ['Nothing blooms all year. Neither should you.',''],
];
function quoteOfDay(){const n=Math.floor(parseISO(today()).getTime()/864e5);return QUOTES[n%QUOTES.length]}

/* recurrence: expand a recurring item into a date list within a range */
function occursOn(item,date){
  if(!item.repeat||item.repeat==='none')return item.date===date;
  if(item.date>date)return false;
  if(item.repeatEnd&&date>item.repeatEnd)return false;
  const a=parseISO(item.date),b=parseISO(date);
  const days=Math.round((b-a)/864e5);
  switch(item.repeat){
    case'daily':return days>=0;
    case'weekdays':return days>=0&&b.getDay()>0&&b.getDay()<6;
    case'weekly':return days>=0&&days%7===0;
    case'biweekly':return days>=0&&days%14===0;
    case'monthly':return b.getDate()===a.getDate();
    case'yearly':return b.getDate()===a.getDate()&&b.getMonth()===a.getMonth();
  }
  return false;
}
const REPEATS=[['none','Does not repeat'],['daily','Every day'],['weekdays','Weekdays'],['weekly','Every week'],['biweekly','Every 2 weeks'],['monthly','Every month'],['yearly','Every year']];

function eventsOn(date){
  return D.events.filter(e=>occursOn(e,date)).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));
}
/* tasks due on / before a date, plus recurring task instances */
function tasksFor(date){
  return D.tasks.filter(t=>{
    if(t.repeat&&t.repeat!=='none')return occursOn(t,date)&&!(t.doneDates||[]).includes(date);
    return !t.done&&t.due&&t.due<=date;
  });
}
function taskDone(t,date){
  if(t.repeat&&t.repeat!=='none')return (t.doneDates||[]).includes(date||today());
  return !!t.done;
}
function toggleTask(id,date){
  const t=D.tasks.find(x=>x.id===id);if(!t)return;
  const d=date||today();
  if(t.repeat&&t.repeat!=='none'){
    t.doneDates=t.doneDates||[];
    const i=t.doneDates.indexOf(d);
    i>-1?t.doneDates.splice(i,1):t.doneDates.push(d);
  }else{
    t.done=!t.done; t.doneAt=t.done?new Date().toISOString():null;
    if(t.done)t.status='done'; else if(t.status==='done')t.status='todo';
  }
  checkBadges(); save(); render();
}
function taskProgress(t){
  const s=t.subtasks||[];if(!s.length)return t.done?100:0;
  return pct(s.filter(x=>x.done).length,s.length);
}

/* habits */
function habitDue(h,date){
  const d=parseISO(date);
  if(h.freq==='daily')return !h.days||!h.days.length||h.days.includes(d.getDay());
  if(h.freq==='weekly')return d.getDay()===(h.anchor??1);
  if(h.freq==='monthly')return d.getDate()===(h.anchor||1);
  return true;
}
function habitDone(id,date){return !!(D.habitLog[date]||{})[id]}
function toggleHabit(id,date){
  const d=date||today();
  D.habitLog[d]=D.habitLog[d]||{};
  D.habitLog[d][id]?delete D.habitLog[d][id]:D.habitLog[d][id]=1;
  if(!Object.keys(D.habitLog[d]).length)delete D.habitLog[d];
  checkBadges(); save(); render();
}
function streak(h){
  let n=0,d=today();
  if(!habitDone(h.id,d)&&habitDue(h,d))d=addDays(d,-1);
  for(let i=0;i<400;i++){
    if(!habitDue(h,d)){d=addDays(d,-1);continue}
    if(habitDone(h.id,d)){n++;d=addDays(d,-1)}else break;
  }
  return n;
}
function bestStreak(h){
  const dates=Object.keys(D.habitLog).filter(d=>D.habitLog[d][h.id]).sort();
  let best=0,run=0,prev=null;
  dates.forEach(d=>{
    if(prev){let p=addDays(prev,1);while(p<d&&!habitDue(h,p))p=addDays(p,1);run=(p===d)?run+1:1}
    else run=1;
    best=Math.max(best,run);prev=d;
  });
  return best;
}
function successRate(h,days=30){
  let due=0,hit=0;
  for(let i=0;i<days;i++){const d=addDays(today(),-i);
    if(d<h.created)continue;
    if(habitDue(h,d)){due++;if(habitDone(h.id,d))hit++}}
  return pct(hit,due);
}

/* productivity score → the Bloom Ring petals */
function bloomPetals(date=today()){
  const tl=tasksFor(date),tdone=D.tasks.filter(t=>taskDone(t,date)&&(t.due===date||occursOn(t,date))).length;
  const hDue=D.habits.filter(h=>habitDue(h,date)),hDone=hDue.filter(h=>habitDone(h.id,date)).length;
  const w=D.water[date]||0, goal=D.settings.waterGoal||8;
  const mins=sum(D.focusLog.filter(f=>f.date===date).map(f=>f.mins));
  return [
    {k:'Tasks',v:pct(tdone,Math.max(tdone+tl.length,1)),c:'var(--blush)',ico:'✓'},
    {k:'Habits',v:hDue.length?pct(hDone,hDue.length):0,c:'var(--sage)',ico:'🌱'},
    {k:'Mood',v:D.moods[date]?D.moods[date]*20:0,c:'var(--peach)',ico:'😊'},
    {k:'Water',v:pct(w,goal),c:'var(--info)',ico:'💧'},
    {k:'Focus',v:clamp(Math.round(mins/60*100),0,100),c:'var(--lav)',ico:'⏱'},
    {k:'Journal',v:D.journal.some(j=>j.date===date)?100:0,c:'var(--blush-deep)',ico:'📖'},
  ];
}
function productivityScore(date=today()){
  const p=bloomPetals(date); return Math.round(sum(p.map(x=>Math.min(x.v,100)))/p.length);
}
function weekProgress(){
  const s=startOfWeek(today());
  return [...Array(7)].map((_,i)=>{const d=addDays(s,i);return{d,v:d<=today()?productivityScore(d):null}});
}

/* badges */
const BADGES=[
  {id:'first',n:'First step',i:'🌱',d:'Complete your first task',test:()=>D.tasks.some(t=>t.done)},
  {id:'ten',n:'Ten down',i:'✅',d:'Complete 10 tasks',test:()=>D.tasks.filter(t=>t.done).length>=10},
  {id:'fifty',n:'Half century',i:'🏅',d:'Complete 50 tasks',test:()=>D.tasks.filter(t=>t.done).length>=50},
  {id:'week',n:'Seven days',i:'🔥',d:'Keep any habit 7 days',test:()=>D.habits.some(h=>streak(h)>=7)},
  {id:'month',n:'Thirty days',i:'🌸',d:'Keep any habit 30 days',test:()=>D.habits.some(h=>streak(h)>=30)},
  {id:'writer',n:'Storyteller',i:'📖',d:'Write 10 journal entries',test:()=>D.journal.length>=10},
  {id:'hydrated',n:'Well watered',i:'💧',d:'Hit your water goal',test:()=>Object.entries(D.water).some(([d,v])=>v>=(D.settings.waterGoal||8))},
  {id:'focused',n:'Deep worker',i:'⏱',d:'Log 10 focus sessions',test:()=>D.focusLog.length>=10},

  {id:'planner',n:'Fully planned',i:'🗓',d:'Plan a full week of meals',test:()=>{const s=startOfWeek(today());return [...Array(7)].every((_,i)=>(D.meals[addDays(s,i)]||{}).dinner)}},

function checkBadges(){
  BADGES.forEach(b=>{if(!D.badges.includes(b.id)&&b.test()){D.badges.push(b.id);setTimeout(()=>toast(`${b.i} Badge earned — ${b.n}`),300)}});

/* small UI builders */
function ring(v,size=86,label='',stroke=8,color='var(--accent)'){
  const r=(size-stroke)/2,c=2*Math.PI*r;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle class="track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
    <circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke="${color}"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-clamp(v,0,100)/100)}"/></svg>
    <div class="lbl"><b>${Math.round(v)}%</b>${label?`<span class="xs faint">${esc(label)}</span>`:''}</div></div>`;
}
function bar(v,label){return `<div>${label?`<div class="row xs faint" style="margin-bottom:5px"><span>${label}</span><span class="sp" style="flex:1"></span><span class="tnum">${Math.round(v)}%</span></div>`:''}<div class="bar"><i style="width:${clamp(v,0,100)}%"></i></div></div>`}
function emptyState(ico,title,text,btn){
  return `<div class="empty"><span class="e-ico">${ico}</span><h4>${esc(title)}</h4><div class="sm">${esc(text)}</div>${btn||''}</div>`;
}
function sprig(){return `<svg class="petal-bg" viewBox="0 0 100 100"><g stroke="var(--sage)" fill="none" stroke-width="1.5">
  <path d="M50 96 C50 60 50 30 50 8"/><path d="M50 70 C34 66 26 54 24 42 C40 44 48 56 50 70"/>
  <path d="M50 56 C66 52 74 40 76 28 C60 30 52 42 50 56"/></g>
  <circle cx="50" cy="10" r="7" fill="var(--blush)" opacity=".8"/><circle cx="50" cy="10" r="3" fill="var(--peach)"/></svg>`}

/* =====================================================================
   BLOOM RING — the signature visual
   ===================================================================== */
function bloomRing(size=232){
  const p=bloomPetals(),score=productivityScore(),c=size/2;
  const petals=p.map((x,i)=>{
    const a=i*60, open=clamp(x.v,0,100)/100;
    const ry=26+open*40, rx=15+open*11;
    return `<g transform="rotate(${a} ${c} ${c})">
      <ellipse cx="${c}" cy="${c-ry-12}" rx="${rx}" ry="${ry}" fill="${x.c}"
        opacity="${.22+open*.55}" stroke="${x.c}" stroke-width="1.2" stroke-opacity=".5"
        style="transition:all .9s cubic-bezier(.32,.72,0,1)"/>
      <text x="${c}" y="${c-ry-8}" text-anchor="middle" font-size="13" opacity="${.35+open*.65}"
        transform="rotate(${-a} ${c} ${c-ry-12})">${x.ico}</text></g>`;
  }).join('');
  return `<div style="position:relative;width:${size}px;height:${size}px;margin:0 auto">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${c}" cy="${c}" r="${c-2}" fill="none" stroke="var(--line)" stroke-dasharray="2 6"/>
      ${petals}
      <circle cx="${c}" cy="${c}" r="34" fill="var(--card-solid)" stroke="var(--line)"/>
    </svg>
    <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none">
      <div><div class="display" style="font-size:30px;font-weight:600;line-height:1">${score}</div>
      <div class="eyebrow" style="font-size:8.5px">Bloom score</div></div>
    </div></div>`;
}

/* ---------- weather: keyless (open-meteo), cached, graceful offline ---------- */
const WCODE={0:['Clear','☀️'],1:['Mostly clear','🌤'],2:['Partly cloudy','⛅'],3:['Overcast','☁️'],45:['Fog','🌫'],48:['Fog','🌫'],
 51:['Light drizzle','🌦'],53:['Drizzle','🌦'],55:['Heavy drizzle','🌧'],61:['Light rain','🌧'],63:['Rain','🌧'],65:['Heavy rain','⛈'],
 71:['Light snow','🌨'],73:['Snow','🌨'],75:['Heavy snow','❄️'],80:['Showers','🌦'],81:['Showers','🌧'],82:['Heavy showers','⛈'],
 95:['Thunderstorm','⛈'],96:['Thunderstorm','⛈'],99:['Thunderstorm','⛈']};
async function loadWeather(force){
  const box=$('#weather-body'); if(!box)return;
  const cache=JSON.parse(localStorage.getItem('bloomspace.weather')||'null');
  if(cache&&!force&&Date.now()-cache.at<36e5)return paintWeather(cache.data);
  if(!navigator.onLine){return box.innerHTML=cache?paintWeather(cache.data,1):`<span class="faint">Offline — weather will refresh when you reconnect.</span>`}
  const put=(pos)=>fetchW(pos.coords.latitude,pos.coords.longitude);
  if(!navigator.geolocation)return box.innerHTML=`<span class="faint">Location unavailable in this browser.</span>`;
  navigator.geolocation.getCurrentPosition(put,()=>{box.innerHTML=`<span class="faint">Allow location access to see today's weather.</span>
    <div class="row mt"><button class="btn sm" id="w-retry">Try again</button></div>`;$('#w-retry')?.addEventListener('click',()=>loadWeather(true))},{timeout:8000});
}
async function fetchW(lat,lon){
  const box=$('#weather-body');
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,weather_code&timezone=auto&temperature_unit=${D.settings.units==='metric'?'celsius':'fahrenheit'}&forecast_days=4`);
    const j=await r.json();
    localStorage.setItem('bloomspace.weather',JSON.stringify({at:Date.now(),data:j}));
    paintWeather(j);
  }catch(e){box.innerHTML=`<span class="faint">Couldn't reach the weather service.</span>`}
}
function paintWeather(j,stale){
  const box=$('#weather-body'); if(!box||!j?.current)return'';
  const u=D.settings.units==='metric'?'°C':'°F';
  const [txt,ico]=WCODE[j.current.weather_code]||['—','🌡'];
  box.innerHTML=`<div class="row"><div style="font-size:38px">${ico}</div>
    <div><div class="display" style="font-size:30px;line-height:1">${Math.round(j.current.temperature_2m)}${u}</div>
    <div class="xs faint">${txt} · ${j.current.relative_humidity_2m}% humidity</div></div></div>
    <div class="row mt wrap" style="gap:12px">${(j.daily?.time||[]).slice(1,4).map((d,i)=>{const[,ic]=WCODE[j.daily.weather_code[i+1]]||['','🌡'];
      return `<div class="center xs"><div class="faint">${new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short'})}</div>
      <div style="font-size:17px">${ic}</div><div class="tnum">${Math.round(j.daily.temperature_2m_max[i+1])}°</div></div>`}).join('')}</div>
    ${stale?'<div class="xs faint mt">Last known conditions (offline)</div>':''}`;
}

}
PAGES.calendar={

      cell.ondragover=ex=>{ex.preventDefault();cell.classList.add('drop')};

        ex.preventDefault();cell.classList.remove('drop');
        const id=ex.dataTransfer.getData('text/plain'),ev=D.events.find(e=>e.id===id);
        if(!ev)return;
        mut(()=>{ev.date=cell.dataset.drop;if(cell.dataset.hour!==undefined&&!ev.allDay){
          const h=+cell.dataset.hour,dur=durMin(ev);ev.start=hhmm(h*60);ev.end=hhmm(h*60+dur)}});
        toast(`Moved to ${relDay(cell.dataset.drop)}`);
      };
    });
    $$('[data-newat]').forEach(c=>c.onclick=()=>{calState.date=c.dataset.newat;
      const h=c.dataset.hour;eventModal({date:c.dataset.newat,start:hhmm(h*60),end:hhmm(h*60+60),cat:D.categories[0].id,repeat:'none'})});
    $$('[data-openday]').forEach(b=>b.onclick=()=>{calState.date=b.dataset.openday;calState.view='day';render()});
  }
};
const toMin=t=>{if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+m};
const hhmm=m=>`${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const durMin=e=>Math.max(30,toMin(e.end)-toMin(e.start)||60);
const t12=t=>{const[h,m]=t.split(':').map(Number);const ap=h<12?'am':'pm';return `${((h+11)%12)+1}${m?':'+String(m).padStart(2,'0'):''}${ap}`};

function monthView(){
  const cur=parseISO(calState.date),y=cur.getFullYear(),mo=cur.getMonth();
  const first=new Date(y,mo,1),start=addDays(iso(first),-((first.getDay()+6)%7));
  const dows=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i),dd=parseISO(d),out=dd.getMonth()!==mo;
    const evs=eventsOn(d),tk=tasksFor(d);
    cells+=`<div class="cal-cell ${out?'out':''} ${d===today()?'today':''}" data-drop="${d}">
      <div class="row"><button class="cal-n" data-openday="${d}">${dd.getDate()}</button><span style="flex:1"></span>
        ${tk.length?`<span class="xs faint">✓${tk.length}</span>`:''}</div>
      ${evs.slice(0,3).map(e=>`<div class="ev" data-ev="${e.id}" style="--ec:${catColor(e.cat)}">${e.allDay?'':t12(e.start)+' '}${esc(e.title)}</div>`).join('')}
      ${evs.length>3?`<button class="xs faint" data-openday="${d}" style="text-align:left">+${evs.length-3} more</button>`:''}
    </div>`;
  }
  return `<div class="card solid"><div class="cal-grid">${dows.map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div></div>`;
}
function weekView(){
  const s=startOfWeek(calState.date);
  const days=[...Array(7)].map((_,i)=>addDays(s,i));
  const hours=[...Array(17)].map((_,i)=>i+6);
  return `<div class="card solid" style="overflow-x:auto">
    <div style="display:grid;grid-template-columns:56px repeat(7,minmax(96px,1fr));min-width:720px">
      <div></div>
      ${days.map(d=>`<button class="center" data-openday="${d}" style="padding-bottom:8px">
        <div class="cal-dow">${fmt(d,{weekday:'short'})}</div>
        <div class="display" style="font-size:18px;${d===today()?'color:var(--accent-deep)':''}">${parseISO(d).getDate()}</div></button>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:56px repeat(7,minmax(96px,1fr));min-width:720px">
      <div>${hours.map(h=>`<div class="tl-h">${t12(hhmm(h*60))}</div>`).join('')}</div>
      ${days.map(d=>{const evs=eventsOn(d).filter(e=>!e.allDay);
        return `<div style="position:relative;border-left:1px solid var(--line)">
          ${hours.map(h=>`<div class="tl-s" data-drop="${d}" data-hour="${h}" data-newat="${d}"></div>`).join('')}
          ${evs.map(e=>{const top=(toMin(e.start)-360)/60*56,h=durMin(e)/60*56;
            if(top<0||top>hours.length*56)return'';
            return `<div class="tl-ev" data-ev="${e.id}" style="--ec:${catColor(e.cat)};top:${top}px;height:${Math.max(h-3,22)}px">${esc(e.title)}</div>`}).join('')}
        </div>`}).join('')}
    </div></div>`;
}
function dayView(){
  const d=calState.date,evs=eventsOn(d),all=evs.filter(e=>e.allDay),timed=evs.filter(e=>!e.allDay);
  const hours=[...Array(19)].map((_,i)=>i+5);
  const tk=tasksFor(d);
  const blocked=sum(timed.map(durMin));
  return `<div class="grid" style="grid-template-columns:minmax(0,2fr) minmax(0,1fr)">
    <div class="card solid">
      <div class="card-h"><h3>${relDay(d)}</h3><span class="sp"></span>
        <span class="chip">${(blocked/60).toFixed(1)}h blocked</span></div>
      ${all.length?`<div class="stack" style="margin-bottom:12px">${all.map(e=>`<div class="list-item" data-ev="${e.id}">
        <span class="dot" style="background:${catColor(e.cat)}"></span><div class="li-t">${esc(e.title)}</div><span class="xs faint">All day</span></div>`).join('')}</div>`:''}
      <div class="tl">
        <div>${hours.map(h=>`<div class="tl-h">${t12(hhmm(h*60))}</div>`).join('')}</div>
        <div style="position:relative">
          ${hours.map(h=>`<div class="tl-s" data-drop="${d}" data-hour="${h}" data-newat="${d}"></div>`).join('')}
          ${timed.map(e=>{const top=(toMin(e.start)-300)/60*56,hh=durMin(e)/60*56;
            return `<div class="tl-ev" data-ev="${e.id}" style="--ec:${catColor(e.cat)};top:${top}px;height:${Math.max(hh-3,24)}px">
              ${esc(e.title)}<div class="xs" style="opacity:.7;font-weight:500">${t12(e.start)}–${t12(e.end||e.start)}${e.place?' · '+esc(e.place):''}</div></div>`}).join('')}
        </div>
      </div>
      <div class="xs faint mt">Tap an empty slot to block time. Drag an event to move it.</div>
    </div>
    <div class="stack">
      <div class="card">
        <div class="card-h"><h3>Due this day</h3></div>
        ${tk.length?`<div class="stack">${tk.map(t=>`<div class="list-item"><button class="check" data-tt2="${t.id}">✓</button>
          <div class="li-t">${esc(t.title)}</div><span class="dot" style="background:${PRIOS[t.prio||'low'].c}"></span></div>`).join('')}</div>`
          :emptyState('✓','Nothing due','No tasks land on this day.')}
      </div>
      <div class="card">
        <div class="card-h"><h3>Time blocking</h3></div>
        <div class="sm muted">Blocks turn intentions into appointments with yourself. Try one 90-minute block for the thing you keep postponing.</div>
        <div class="stack mt">${['Deep work','Admin & email','Movement','Rest','Family time'].map(b=>`<button class="list-item" data-block="${b}"><span class="li-t">${b}</span><span class="xs faint">＋ block</span></button>`).join('')}</div>
      </div>
    </div></div>`;
}

<script>
/* =====================================================================
   PAGE: TASKS
   ===================================================================== */
const tState={view:'list',q:'',cat:'all',sort:'smart',show:'open',list:'all'};
const KCOLS=[['todo','To do'],['next','Up next'],['doing','In progress'],['done','Done']];
function taskModal(tk){
  const t=tk||{id:null,prio:'med',due:today(),cat:D.categories[0].id,repeat:'none',status:'todo',subtasks:[]};
  const m=modal({title:tk?'Edit task':'New task',confirm:tk?'Save changes':'Add task',

      <div class="grid g2" style="gap:12px">
        ${field('Due date',`<input class="input" type="date" id="t-d" value="${t.due||''}">`)}
        ${field('Priority',`<select class="select" id="t-p">${Object.entries(PRIOS).map(([k,v])=>`<option value="${k}" ${t.prio===k?'selected':''}>${v.l}</option>`).join('')}</select>`)}
      </div>
      <div class="grid g2" style="gap:12px">
        ${field('Category',`<select class="select" id="t-c">${catOptions(t.cat)}</select>`)}

      </div>

        <datalist id="tlists">${[...new Set(D.tasks.map(x=>x.list).filter(Boolean))].map(l=>`<option>${esc(l)}</option>`).join('')}</datalist>`)}
      ${field('Notes',`<textarea class="ta" id="t-n" placeholder="Details, links, context">${esc(t.notes||'')}</textarea>`)}
      ${field('Subtasks (one per line)',`<textarea class="ta" id="t-s" placeholder="Step one&#10;Step two">${(t.subtasks||[]).map(s=>s.text).join('\n')}</textarea>`)}
      ${field('Attachment link',`<input class="input" id="t-a" value="${esc(t.attach||'')}" placeholder="Paste a file or document link">`)}
      ${tk?`<button class="btn ghost" id="t-del" style="color:var(--bad)">Delete this task</button>`:''}`,
    onConfirm:s=>{
      const title=$('#t-t',s).value.trim(); if(!title){toast('Give the task a name first');return false}
      const lines=$('#t-s',s).value.split('\n').map(x=>x.trim()).filter(Boolean);
      const old=t.subtasks||[];
      const o={id:t.id||uid(),title,due:$('#t-d',s).value||null,prio:$('#t-p',s).value,cat:$('#t-c',s).value,
        repeat:$('#t-r',s).value,list:$('#t-l',s).value.trim()||null,notes:$('#t-n',s).value.trim(),
        attach:$('#t-a',s).value.trim(),status:t.status||'todo',done:!!t.done,doneDates:t.doneDates||[],
        date:$('#t-d',s).value||today(),created:t.created||today(),
        subtasks:lines.map(x=>({id:uid(),text:x,done:!!(old.find(o2=>o2.text===x)||{}).done}))};
      mut(()=>{const i=D.tasks.findIndex(x=>x.id===o.id);i>-1?D.tasks[i]=o:D.tasks.unshift(o)});
      toast(tk?'Task updated':'Task added');
    }});
  $('#t-del',m.el)?.addEventListener('click',()=>{m.close();confirmDialog('Delete task?',`"${t.title}" will be removed.`,()=>{mut(()=>{D.tasks=D.tasks.filter(x=>x.id!==t.id)});toast('Task deleted')})});
}
function sortTasks(a){
  const rank=t=>({high:0,med:1,low:2})[t.prio||'low'];
  const arr=[...a];
  if(tState.sort==='smart')arr.sort((x,y)=>{
    const ox=x.due?(x.due<today()?-1:0):1, oy=y.due?(y.due<today()?-1:0):1;
    return ox-oy||(x.due||'9999').localeCompare(y.due||'9999')||rank(x)-rank(y);
  });
  if(tState.sort==='due')arr.sort((x,y)=>(x.due||'9999').localeCompare(y.due||'9999'));
  if(tState.sort==='prio')arr.sort((x,y)=>rank(x)-rank(y));
  if(tState.sort==='az')arr.sort((x,y)=>x.title.localeCompare(y.title));
  if(tState.sort==='new')arr.reverse();
  return arr;
}
PAGES.tasks={
  title:'To-do lists',
  sub:()=>{const o=D.tasks.filter(t=>!taskDone(t)).length;return `${o} open · ${D.tasks.filter(t=>t.done).length} completed`},
  render(){
    const lists=[...new Set(D.tasks.map(t=>t.list).filter(Boolean))];
    let f=D.tasks.filter(t=>{
      if(tState.show==='open'&&taskDone(t))return false;
      if(tState.show==='done'&&!taskDone(t))return false;
      if(tState.show==='today'&&!(t.due&&t.due<=today()&&!taskDone(t)))return false;
      if(tState.cat!=='all'&&t.cat!==tState.cat)return false;
      if(tState.list!=='all'&&t.list!==tState.list)return false;
      if(tState.q){const q=tState.q.toLowerCase();
        if(!(t.title+' '+(t.notes||'')+' '+(t.list||'')).toLowerCase().includes(q))return false}
      return true;
    });

    const done=D.tasks.filter(t=>taskDone(t)).length,total=D.tasks.length;
    const head=`
    <div class="card solid" style="margin-bottom:18px">
      <div class="row wrap">
        <div class="search" style="flex:1;min-width:200px"><input class="input" id="t-q" placeholder="Search tasks, notes and lists" value="${esc(tState.q)}"></div>
        <div class="tabs">${[['list','List'],['kanban','Board']].map(([v,l])=>`<button class="chip tab ${tState.view===v?'on':''}" data-tv="${v}">${l}</button>`).join('')}</div>
        <button class="btn accent" id="t-new">＋ New task</button>
      </div>
      <div class="row wrap mt" style="gap:8px">
        ${[['open','Open'],['today','Due now'],['done','Completed'],['all','Everything']].map(([v,l])=>`<button class="chip tab ${tState.show===v?'on':''}" data-tshow="${v}">${l}</button>`).join('')}
        <span style="flex:1"></span>
        <select class="select" id="t-cat" style="width:auto"><option value="all">All categories</option>${catOptions(tState.cat)}</select>
        ${lists.length?`<select class="select" id="t-list" style="width:auto"><option value="all">All lists</option>${lists.map(l=>`<option ${tState.list===l?'selected':''}>${esc(l)}</option>`).join('')}</select>`:''}
        <select class="select" id="t-sort" style="width:auto">${[['smart','Smart order'],['due','By due date'],['prio','By priority'],['az','A–Z'],['new','Newest']].map(([v,l])=>`<option value="${v}" ${tState.sort===v?'selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="mt">${bar(pct(done,total),`${done} of ${total} tasks complete`)}</div>
    </div>`;
    if(!D.tasks.length)return head+`<div class="card">${emptyState('✓','No tasks yet','Add the first thing on your mind — you can always refine it later.','<button class="btn accent mt" id="t-new2">Add your first task</button>')}</div>`;
    return head+(tState.view==='kanban'?kanban(f):taskList(f));
  },
  after(){

    if(q){q.oninput=()=>{tState.q=q.value;const p=q.selectionStart;render();const n=$('#t-q');n.focus();n.setSelectionRange(p,p)}}

    $('#t-new2')?.addEventListener('click',()=>taskModal());

    $$('[data-tshow]').forEach(b=>b.onclick=()=>{tState.show=b.dataset.tshow;render()});
    const c=$('#t-cat');if(c)c.onchange=()=>{tState.cat=c.value;render()};
    const l=$('#t-list');if(l)l.onchange=()=>{tState.list=l.value;render()};
    const s=$('#t-sort');if(s)s.onchange=()=>{tState.sort=s.value;render()};
    $$('[data-tk]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-stop]'))return;taskModal(D.tasks.find(t=>t.id===b.dataset.tk))});
    $$('[data-tog]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleTask(b.dataset.tog)});
    $$('[data-sub]').forEach(b=>b.onclick=e=>{e.stopPropagation();
      mut(()=>{const t=D.tasks.find(x=>x.id===b.dataset.tid);const st=t.subtasks.find(x=>x.id===b.dataset.sub);st.done=!st.done})});
    $$('[data-tdel]').forEach(b=>b.onclick=e=>{e.stopPropagation();const t=D.tasks.find(x=>x.id===b.dataset.tdel);
      confirmDialog('Delete task?',`"${t.title}" will be removed.`,()=>{mut(()=>{D.tasks=D.tasks.filter(x=>x.id!==t.id)});toast('Task deleted')})});
    $$('[data-kcard]').forEach(el=>{el.draggable=true;
      el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.kcard);el.classList.add('dragging')};
      el.ondragend=()=>el.classList.remove('dragging')});
    $$('[data-kcol]').forEach(col=>{
      col.ondragover=e=>{e.preventDefault();col.classList.add('drop')};
      col.ondragleave=()=>col.classList.remove('drop');
      col.ondrop=e=>{e.preventDefault();col.classList.remove('drop');
        const id=e.dataTransfer.getData('text/plain'),t=D.tasks.find(x=>x.id===id);if(!t)return;
        mut(()=>{t.status=col.dataset.kcol;t.done=col.dataset.kcol==='done';if(t.done)t.doneAt=new Date().toISOString();checkBadges()})};
    });
  }
};

function taskList(f){
  if(!f.length)return `<div class="card">${emptyState('🔍','Nothing matches','Try a different filter or search term.')}</div>`;
  const groups={};
  f.forEach(t=>{
    const k=!t.due?'No date':t.due<today()?'Overdue':t.due===today()?'Today':t.due===addDays(today(),1)?'Tomorrow':t.due<=addDays(today(),7)?'This week':'Later';
    (groups[k]=groups[k]||[]).push(t);
  });
  const order=['Overdue','Today','Tomorrow','This week','Later','No date'];
  return `<div class="stack" style="gap:20px">${order.filter(k=>groups[k]).map(k=>`<div>
    <div class="row" style="margin-bottom:9px"><span class="eyebrow" ${k==='Overdue'?'style="color:var(--bad)"':''}>${k}</span>
      <span class="xs faint">${groups[k].length}</span></div>
    <div class="stack">${groups[k].map(taskRow).join('')}</div></div>`).join('')}</div>`;
}
function kanban(f){
  return `<div class="kb">${KCOLS.map(([k,l])=>{
    const items=f.filter(t=>(t.status||'todo')===k);
    return `<div class="kb-col" data-kcol="${k}">
      <div class="kb-h">${l}<span style="flex:1"></span><span>${items.length}</span></div>
      ${items.map(t=>`<div class="kb-card" data-kcard="${t.id}" data-tk="${t.id}">
        <div class="row" style="align-items:flex-start"><div class="li-t" style="font-weight:600">${esc(t.title)}</div>
        <span class="dot" style="background:${PRIOS[t.prio||'low'].c}"></span></div>
        ${t.subtasks?.length?`<div style="margin-top:9px">${bar(taskProgress(t))}</div>`:''}
        <div class="row wrap xs faint" style="gap:7px;margin-top:8px">
          <span class="chip xs" style="background:color-mix(in srgb,${catColor(t.cat)} 20%,transparent);border-color:transparent">${esc(catName(t.cat))}</span>
          ${t.due?`<span ${t.due<today()?'style="color:var(--bad)"':''}>${relDay(t.due)}</span>`:''}</div>
      </div>`).join('')||`<div class="xs faint center" style="padding:16px">Drag tasks here</div>`}
    </div>`}).join('')}</div>
    <div class="xs faint mt">Drag a card between columns to change its stage.</div>`;
}

<script>
/* =====================================================================

const DOWS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function habitModal(hb){
  const h=hb||{id:null,freq:'daily',icon:'🌱',days:[],anchor:1,color:'#8CA383'};
  const m=modal({title:hb?'Edit habit':'New habit',confirm:hb?'Save changes':'Create habit',
    body:`<div class="grid g2" style="gap:12px">
        ${field('Habit',`<input class="input" id="h-n" value="${esc(h.name||'')}" placeholder="Morning walk">`)}

      <div id="h-days">${field('On these days (leave empty for every day)',
        `<div class="row wrap">${DOWS.map((d,i)=>`<button class="chip tab ${(h.days||[]).includes(i)?'on':''}" data-hd="${i}">${d}</button>`).join('')}</div>`)}</div>

      ${field('Why it matters',`<input class="input" id="h-w" value="${esc(h.why||'')}" placeholder="Keeps my head clear">`)}
      ${field('Reminder time',`<input class="input" type="time" id="h-r" value="${h.remind||''}">`)}
      ${hb?`<button class="btn ghost" id="h-del" style="color:var(--bad)">Delete habit and history</button>`:''}`,
    onConfirm:s=>{
      const n=$('#h-n',s).value.trim();if(!n){toast('Name the habit first');return false}
      const days=$$('[data-hd].on',s).map(b=>+b.dataset.hd);
      const o={id:h.id||uid(),name:n,icon:$('#h-i',s).value||'🌱',freq:$('#h-f',s).value,days,
        anchor:+$('#h-a',s).value||1,why:$('#h-w',s).value.trim(),remind:$('#h-r',s).value||null,
        created:h.created||today(),color:h.color};
      mut(()=>{const i=D.habits.findIndex(x=>x.id===o.id);i>-1?D.habits[i]=o:D.habits.push(o)});
      toast(hb?'Habit updated':'Habit created');
    }});
  $$('[data-hd]',m.el).forEach(b=>b.onclick=()=>b.classList.toggle('on'));

    mut(()=>{D.habits=D.habits.filter(x=>x.id!==h.id);Object.keys(D.habitLog).forEach(d=>{delete D.habitLog[d][h.id]})});toast('Habit deleted')})});
}
PAGES.habits={
  title:'Habits',
  sub:()=>{const d=D.habits.filter(h=>habitDue(h,today()));return `${d.filter(h=>habitDone(h.id,today())).length} of ${d.length} done today`},
  render(){
    const t=today();
    if(!D.habits.length)return `<div class="card">${emptyState('🌱','No habits yet','Pick one small thing you can do on your worst day, not your best one.','<button class="btn accent mt" id="h-new2">Create your first habit</button>')}</div>`;
    const week=[...Array(7)].map((_,i)=>addDays(startOfWeek(t),i));

      <div class="tabs">${[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['all','All']].map(([v,l])=>`<button class="chip tab ${(tab.habits||'all')===v?'on':''}" data-tab="${v}" data-tabkey="habits">${l}</button>`).join('')}</div>
      <span style="flex:1"></span><button class="btn accent" id="h-new">＋ New habit</button></div>

    <div class="card solid" style="margin-bottom:18px;overflow-x:auto">
      <div class="card-h"><h3>This week</h3><span class="sp"></span><span class="xs faint">Tap any square to log it</span></div>
      <div style="min-width:520px">
        <div style="display:grid;grid-template-columns:minmax(140px,1.6fr) repeat(7,1fr) 74px;gap:6px;align-items:center">
          <div></div>${week.map(d=>`<div class="center"><div class="cal-dow">${fmt(d,{weekday:'narrow'})}</div>
            <div class="xs ${d===t?'':'faint'}" style="${d===t?'font-weight:800;color:var(--accent-deep)':''}">${parseISO(d).getDate()}</div></div>`).join('')}
          <div class="cal-dow center">Streak</div>
          ${D.habits.filter(h=>(tab.habits||'all')==='all'||h.freq===(tab.habits||'all')).map(h=>`
            <div class="row" style="min-width:0"><button class="li-t" data-hedit="${h.id}" style="text-align:left">${esc(h.icon)} ${esc(h.name)}</button></div>
            ${week.map(d=>{const due=habitDue(h,d),on=habitDone(h.id,d),fut=d>t;
              return `<div class="center"><button class="check ${on?'on sage':''}" data-hlog="${h.id}" data-d="${d}"
                style="margin:0 auto;${!due?'opacity:.25':''}${fut?';opacity:.4':''}">✓</button></div>`}).join('')}
            <div class="center"><span class="chip xs">🔥 ${streak(h)}</span></div>`).join('')}
        </div>
      </div>
    </div>

    <div class="grid g2">${D.habits.filter(h=>(tab.habits||'all')==='all'||h.freq===(tab.habits||'all')).map(h=>{
      const rate=successRate(h),days=90;
      const cells=[...Array(days)].map((_,i)=>{const d=addDays(t,-(days-1-i));
        const on=habitDone(h.id,d);return `<i data-l="${on?4:habitDue(h,d)?0:0}" title="${d}"></i>`}).join('');
      return `<div class="card hover">
        <div class="card-h"><h3>${esc(h.icon)} ${esc(h.name)}</h3><span class="sp"></span>
          <button class="btn sm ghost" data-hedit="${h.id}">Edit</button></div>
        ${h.why?`<div class="sm muted" style="margin-bottom:12px">"${esc(h.why)}"</div>`:''}
        <div class="row" style="gap:16px;margin-bottom:14px">
          ${ring(rate,74,'30 days',7,'var(--sage)')}
          <div class="stack" style="flex:1;gap:9px">
            <div><div class="display" style="font-size:21px">🔥 ${streak(h)} days</div><div class="xs faint">Current streak</div></div>
            <div><div class="display" style="font-size:21px">🏆 ${bestStreak(h)} days</div><div class="xs faint">Longest streak</div></div>
          </div>
        </div>
        <div class="xs faint" style="margin-bottom:6px">Last 90 days${h.remind?` · reminder ${t12(h.remind)}`:''}</div>
        <div class="heat">${cells}</div>
      </div>`}).join('')}</div>`;
  },
  after(){
    $('#h-new')?.addEventListener('click',()=>habitModal());
    $('#h-new2')?.addEventListener('click',()=>habitModal());
    $$('[data-hedit]').forEach(b=>b.onclick=()=>habitModal(D.habits.find(h=>h.id===b.dataset.hedit)));
    $$('[data-hlog]').forEach(b=>b.onclick=()=>toggleHabit(b.dataset.hlog,b.dataset.d));
  }
};

function goalModal(gl){
  const g=gl||{id:null,milestones:[],deadline:'',area:'Personal'};
  const m=modal({title:gl?'Edit goal':'New goal',sub:'A goal with a date and a first step is a plan.',confirm:gl?'Save changes':'Create goal',
    body:`${field('Goal',`<input class="input" id="g-t" value="${esc(g.title||'')}" placeholder="Run a 10K without stopping">`)}
      <div class="grid g2" style="gap:12px">
        ${field('Life area',`<select class="select" id="g-a">${['Personal','Career','Health','Money','Home','Relationships','Learning','Creative'].map(a=>`<option ${g.area===a?'selected':''}>${a}</option>`).join('')}</select>`)}
        ${field('Target date',`<input class="input" type="date" id="g-d" value="${g.deadline||''}">`)}
      </div>
      <div class="card" style="background:color-mix(in srgb,var(--lav) 10%,transparent);padding:14px">
        <div class="eyebrow" style="margin-bottom:10px">Make it SMART</div>
        <div class="stack">
          ${field('Specific — what exactly',`<input class="input" id="g-s" value="${esc(g.specific||'')}">`)}
          ${field('Measurable — how you\'ll know',`<input class="input" id="g-m" value="${esc(g.measurable||'')}">`)}
          ${field('Relevant — why it matters',`<input class="input" id="g-r" value="${esc(g.relevant||'')}">`)}
        </div>
      </div>
      ${field('Milestones (one per line)',`<textarea class="ta" id="g-ms" placeholder="Run 3K&#10;Run 5K&#10;Run 8K">${(g.milestones||[]).map(x=>x.text).join('\n')}</textarea>`)}
      ${gl?`<button class="btn ghost" id="g-del" style="color:var(--bad)">Delete this goal</button>`:''}`,
    onConfirm:s=>{
      const t=$('#g-t',s).value.trim();if(!t){toast('Name the goal first');return false}
      const lines=$('#g-ms',s).value.split('\n').map(x=>x.trim()).filter(Boolean);
      const old=g.milestones||[];
      const o={id:g.id||uid(),title:t,area:$('#g-a',s).value,deadline:$('#g-d',s).value||null,
        specific:$('#g-s',s).value.trim(),measurable:$('#g-m',s).value.trim(),relevant:$('#g-r',s).value.trim(),
        milestones:lines.map(x=>({id:uid(),text:x,done:!!(old.find(o2=>o2.text===x)||{}).done})),
        done:!!g.done,created:g.created||today()};
      mut(()=>{const i=D.goals.findIndex(x=>x.id===o.id);i>-1?D.goals[i]=o:D.goals.push(o)});
      toast(gl?'Goal updated':'Goal created');
    }});
  $('#g-del',m.el)?.addEventListener('click',()=>{m.close();confirmDialog('Delete goal?',`"${g.title}" will be removed.`,()=>{mut(()=>{D.goals=D.goals.filter(x=>x.id!==g.id)});toast('Goal deleted')})});
}
function goalPct(g){const ms=g.milestones||[];return g.done?100:ms.length?pct(ms.filter(m=>m.done).length,ms.length):0}
PAGES.goals={
  title:'Goals',
  sub:()=>`${D.goals.filter(g=>!g.done).length} in progress · ${D.badges.length} of ${BADGES.length} badges`,
  render(){
    const v=tab.goals||'goals';
    const head=`<div class="row wrap" style="margin-bottom:18px">
      <div class="tabs">${[['goals','Goals'],['vision','Vision board'],['badges','Achievements']].map(([k,l])=>`<button class="chip tab ${v===k?'on':''}" data-tab="${k}" data-tabkey="goals">${l}</button>`).join('')}</div>
      <span style="flex:1"></span>
      ${v==='vision'?`<button class="btn accent" id="v-new">＋ Add to board</button>`:v==='goals'?`<button class="btn accent" id="g-new">＋ New goal</button>`:''}</div>`;

      return head+`<div class="card solid"><div class="card-h"><h3>Achievements</h3><span class="sp"></span>
        <span class="chip">${D.badges.length}/${BADGES.length}</span></div>
        <div class="row wrap" style="gap:18px;justify-content:center;padding:8px 0">
          ${BADGES.map(b=>{const on=D.badges.includes(b.id);
            return `<div class="badge ${on?'earned':''}" title="${esc(b.d)}"><div class="b-ico">${b.i}</div>
              <div class="xs" style="font-weight:700">${esc(b.n)}</div><div class="xs faint">${esc(b.d)}</div></div>`}).join('')}
        </div></div>`;
    }
    if(v==='vision'){
      if(!D.vision.length)return head+`<div class="card">${emptyState('📌','Your board is empty','Add images and words for the life you\'re building. Paste any image link.','<button class="btn accent mt" id="v-new2">Add your first pin</button>')}</div>`;
      return head+`<div class="vb">${D.vision.map(p=>`<div>
        ${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}
        <div class="vb-c"><div class="row"><h4 style="font-size:16px;flex:1">${esc(p.title||'')}</h4>
          <button class="x" data-vdel="${p.id}">×</button></div>
          ${p.note?`<div class="sm muted" style="margin-top:5px">${esc(p.note)}</div>`:''}</div></div>`).join('')}</div>`;
    }
    if(!D.goals.length)return head+`<div class="card">${emptyState('🎯','No goals yet','Name one thing you want to be true a year from now.','<button class="btn accent mt" id="g-new2">Set your first goal</button>')}</div>`;
    return head+`<div class="grid g2">${D.goals.map(g=>{
      const v2=goalPct(g),left=g.deadline?Math.ceil((parseISO(g.deadline)-parseISO(today()))/864e5):null;
      return `<div class="card hover">
        ${sprig()}
        <div class="row" style="align-items:flex-start;gap:16px">
          ${ring(v2,92,'',9,g.done?'var(--sage)':'var(--accent)')}
          <div style="flex:1;min-width:0">
            <div class="eyebrow">${esc(g.area)}</div>
            <h3 style="font-size:19px;margin:3px 0 6px">${esc(g.title)}</h3>
            ${g.deadline?`<div class="xs ${left<0?'':'faint'}" ${left<0?'style="color:var(--bad);font-weight:700"':''}>
              ${left<0?`${Math.abs(left)} days past target`:left===0?'Target is today':`${left} days to go · ${fmt(g.deadline,{month:'long',day:'numeric'})}`}</div>`:''}
          </div>
        </div>
        ${g.measurable?`<div class="sm muted mt">Done looks like: ${esc(g.measurable)}</div>`:''}
        ${g.milestones?.length?`<div class="stack mt" style="gap:6px">${g.milestones.map(ms=>`
          <button class="row sm" data-gms="${ms.id}" data-gid="${g.id}" style="text-align:left">
            <span class="check ${ms.done?'on sage':''}" style="width:17px;height:17px;flex:0 0 17px;font-size:10px">✓</span>
            <span style="${ms.done?'text-decoration:line-through;opacity:.55':''}">${esc(ms.text)}</span></button>`).join('')}</div>`:''}
        <div class="row mt">
          <button class="btn sm ghost" data-gedit="${g.id}">Edit</button>
          <button class="btn sm ghost" data-gtasks="${g.id}">Break into tasks</button>
          <span style="flex:1"></span>
          <button class="btn sm ${g.done?'':'accent'}" data-gdone="${g.id}">${g.done?'Reopen':'Mark complete'}</button>
        </div>
      </div>`}).join('')}</div>`;
  },
  after(){
    $('#g-new')?.addEventListener('click',()=>goalModal());
    $('#g-new2')?.addEventListener('click',()=>goalModal());
    $$('[data-gedit]').forEach(b=>b.onclick=()=>goalModal(D.goals.find(g=>g.id===b.dataset.gedit)));
    $$('[data-gms]').forEach(b=>b.onclick=()=>mut(()=>{const g=D.goals.find(x=>x.id===b.dataset.gid);
      const m=g.milestones.find(x=>x.id===b.dataset.gms);m.done=!m.done;checkBadges()}));
    $$('[data-gdone]').forEach(b=>b.onclick=()=>mut(()=>{const g=D.goals.find(x=>x.id===b.dataset.gdone);g.done=!g.done;checkBadges()}));
    $$('[data-gtasks]').forEach(b=>b.onclick=()=>{
      const g=D.goals.find(x=>x.id===b.dataset.gtasks);
      if(!g.milestones?.length)return toast('Add milestones to the goal first, then convert them');
      mut(()=>{g.milestones.filter(m=>!m.done).forEach(m=>D.tasks.unshift({id:uid(),title:m.text,prio:'med',
        due:g.deadline||null,cat:D.categories[0].id,repeat:'none',status:'todo',subtasks:[],list:g.title,
        notes:`Milestone for goal: ${g.title}`,created:today()}))});
      toast('Milestones added to your to-do list');
    });
    const vnew=()=>modal({title:'Add to vision board',
      body:`${field('Title',`<input class="input" id="v-t" placeholder="Sunlit studio">`)}
        ${field('Image link',`<input class="input" id="v-i" placeholder="https://…">`)}
        ${field('Why this',`<textarea class="ta" id="v-n" placeholder="What it represents"></textarea>`)}`,
      confirm:'Add pin',onConfirm:s=>{const t=$('#v-t',s).value.trim(),i=$('#v-i',s).value.trim();
        if(!t&&!i){toast('Add a title or an image link');return false}
        mut(()=>D.vision.unshift({id:uid(),title:t,img:i,note:$('#v-n',s).value.trim()}));toast('Added to your board')}});
    $('#v-new')?.addEventListener('click',vnew);$('#v-new2')?.addEventListener('click',vnew);
    $$('[data-vdel]').forEach(b=>b.onclick=()=>mut(()=>{D.vision=D.vision.filter(p=>p.id!==b.dataset.vdel)}));
  }
};
