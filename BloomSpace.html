      start_url:location.href,scope:'./',display:'standalone',orientation:'any',
      background_color:'#FBF7F1',theme_color:D.settings.theme==='dark'?'#191521':'#FBF7F1',
      icons:[192,512].map(sz=>({src:iconURL(sz),sizes:sz+'x'+sz,type:'image/png',purpose:'any'}))};
    const l=document.createElement('link');l.rel='manifest';
    l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
    document.head.append(l);
    const at=document.createElement('link');at.rel='apple-touch-icon';at.href=iconURL(180);document.head.append(at);
    [['apple-mobile-web-app-capable','yes'],['mobile-web-app-capable','yes'],
     ['apple-mobile-web-app-status-bar-style','default'],
     ['apple-mobile-web-app-title',D.settings.appName]].forEach(([n,c])=>{
      const m=document.createElement('meta');m.name=n;m.content=c;document.head.append(m)});
  }catch(e){/* manifest is a bonus, never a blocker */}
  // If this file is hosted alongside a sw.js it will be used. Without one the app
  // still works offline: everything it needs is already inside this single file.
  try{if('serviceWorker'in navigator&&location.protocol.startsWith('http'))
    navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}

/* keyboard shortcuts */
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  if(e.key==='n'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();quickAdd()}
  if(e.key==='/'){e.preventDefault();if(route!=='tasks')go('tasks');setTimeout(()=>$('#t-q')?.focus(),80)}
  if(e.key==='d')go('dashboard');
  if(e.key==='f')go('focus');
  if(e.key==='Escape'&&$('#focus-full').classList.contains('on'))$('#ff-exit').click();
  if(e.key==='Escape'&&$('#sidebar').classList.contains('open')){$('#sidebar').classList.remove('open');$('#nav-scrim')?.remove()}
});

/* boot */
(function boot(){
  buildNav();applyTheme();try{installManifest()}catch(e){}
  const h=location.hash.slice(1);
  route=(h&&PAGES[h])?h:(D.settings.homepage||'dashboard');
  render();save();flagSaved();
  $('#menu-btn').onclick=()=>{$('#sidebar').classList.add('open');
    $('#nav-scrim')?.remove();
    const sc=document.createElement('div');sc.id='nav-scrim';sc.onclick=()=>{$('#sidebar').classList.remove('open');sc.remove()};
    $('#app').append(sc)};
  $('#theme-btn').onclick=()=>{D.settings.theme=D.settings.theme==='dark'?'light':'dark';applyTheme();save();render()};
  $('#quick-btn').onclick=quickAdd;$('#fab').onclick=quickAdd;
  $('#ff-toggle').onclick=fStart;
  $('#ff-reset').onclick=()=>{fReset();if(route==='focus')render()};
  $('#ff-exit').onclick=()=>{$('#focus-full').classList.remove('on');document.exitFullscreen?.().catch(()=>{})};
  window.addEventListener('online',()=>{toast('Back online');loadWeather(true)});
  window.addEventListener('offline',()=>toast('Offline — everything still saves to this browser'));
  // roll the daily view over at midnight
  setInterval(()=>{if(bootDay!==today()){bootDay=today();render()}},60000);
  checkBadges();
  if(!D.tasks.length&&!D.habits.length&&!D.journal.length&&!localStorage.getItem('bloomspace.welcomed')){
    localStorage.setItem('bloomspace.welcomed','1');
    setTimeout(()=>modal({title:'Welcome to BloomSpace',sub:'A quick orientation, then it\'s yours.',
      body:`<div class="stack sm">
        <div>🌸 <b>Today</b> is your home page — the Bloom Ring fills as you look after tasks, habits, mood, water, focus and journalling.</div>
        <div>✚ <b>Quick add</b> (the button, or press <b>n</b>) drops a task, event, note, expense, grocery item or journal entry in without leaving the page.</div>
        <div>💾 Everything saves automatically to this browser. Nothing is uploaded anywhere. Export a backup from <b>Settings</b> now and then.</div>
        <div>📱 Add it to your home screen and it opens like an app, with or without a connection.</div>
        <div>⚙️ Rename it, recolour it, and switch off any dashboard widget you don't want — <b>Settings</b> has all of it.</div>
      </div>`,confirm:'Start with a starter setup',onConfirm:()=>{
        mut(()=>{
          D.habits.push({id:uid(),name:'Drink water',icon:'💧',freq:'daily',days:[],created:today(),why:'Easiest win of the day'});
          D.habits.push({id:uid(),name:'Move for 20 minutes',icon:'🚶',freq:'daily',days:[],created:today()});
          D.habits.push({id:uid(),name:'Ten-minute tidy',icon:'🧺',freq:'daily',days:[],created:today()});
          D.tasks.unshift({id:uid(),title:'Look around BloomSpace and delete this task',due:today(),date:today(),
            prio:'low',cat:D.categories[0].id,repeat:'none',status:'todo',subtasks:[],created:today()});
          CHORE_SEED.slice(0,8).forEach(c=>D.chores.push({id:uid(),...c,log:[]}));
        });
        toast('Starter setup added — change anything you like');
      }}),700);
  }
})();
let bootDay=today();
</script>
</body>
</html>
