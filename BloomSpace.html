   PAGE: JOURNAL
   ===================================================================== */
const PROMPTS=['What went better than expected today?','What am I avoiding, and what is the smallest version of it?',
 'Who made my day easier?','What did my body need today?','What would make tomorrow feel calm?',
 'What did I learn the hard way this week?','What am I ready to let go of?','Where did I feel most like myself?',
 'What is one thing I want to remember about this season of life?','What drained me, and what refilled me?',
 'If this week were a chapter title, what would it be?','What is going well that I have stopped noticing?'];
function journalModal(je){
  const j=je||{id:null,date:today(),type:'daily',grateful:['','',''],mood:null,photos:[]};
  const prompt=PROMPTS[Math.floor(parseISO(today()).getTime()/864e5)%PROMPTS.length];
  const m=modal({title:je?'Edit entry':'New entry',wide:true,confirm:je?'Save entry':'Save entry',
    body:`<div class="grid g3" style="gap:12px">
        ${field('Date',`<input class="input" type="date" id="j-d" value="${j.date}">`)}
        ${field('Type',`<select class="select" id="j-ty">${[['daily','Daily entry'],['gratitude','Gratitude'],['reflection','Reflection prompt']].map(([v,l])=>`<option value="${v}" ${j.type===v?'selected':''}>${l}</option>`).join('')}</select>`)}
        ${field('Title',`<input class="input" id="j-t" value="${esc(j.title||'')}" placeholder="Optional">`)}
      </div>
      ${field('Mood',`<div class="mood-row" id="j-mood">${MOODS.map(x=>`<button class="mood-b ${j.mood===x.v?'on':''}" data-jm="${x.v}">${x.e}</button>`).join('')}</div>`)}
      <div id="j-grat">${field('Three things I am grateful for',
        `<div class="stack">${[0,1,2].map(i=>`<input class="input" data-jg="${i}" value="${esc((j.grateful||[])[i]||'')}" placeholder="${i+1}.">`).join('')}</div>`)}</div>
      <div id="j-refl" class="card" style="padding:13px;background:color-mix(in srgb,var(--blush) 12%,transparent)">
        <div class="eyebrow">Today's prompt</div><div class="display" style="font-size:16px;font-style:italic;margin-top:4px">${esc(prompt)}</div></div>
      ${field('Entry',`<textarea class="ta" id="j-b" style="min-height:170px" placeholder="Write as much or as little as you like.">${esc(j.body||'')}</textarea>`)}
      ${field('Photo links (one per line)',`<textarea class="ta" id="j-p" style="min-height:60px" placeholder="https://…">${(j.photos||[]).join('\n')}</textarea>`)}
      ${je?`<button class="btn ghost" id="j-del" style="color:var(--bad)">Delete this entry</button>`:''}`,
    onConfirm:s=>{
      const body=$('#j-b',s).value.trim(),g=$$('[data-jg]',s).map(i=>i.value.trim());
      if(!body&&!g.some(Boolean)){toast('Write something first');return false}
      const mo=$('.mood-b.on',s)?.dataset.jm;
      const o={id:j.id||uid(),date:$('#j-d',s).value,type:$('#j-ty',s).value,title:$('#j-t',s).value.trim(),
        body,grateful:g,mood:mo?+mo:null,photos:$('#j-p',s).value.split('\n').map(x=>x.trim()).filter(Boolean),
        prompt:$('#j-ty',s).value==='reflection'?prompt:null};
      mut(()=>{const i=D.journal.findIndex(x=>x.id===o.id);i>-1?D.journal[i]=o:D.journal.unshift(o);
        if(o.mood)D.moods[o.date]=o.mood;checkBadges()});
      toast('Entry saved');
    }});
  $$('[data-jm]',m.el).forEach(b=>b.onclick=()=>{const on=b.classList.contains('on');
    $$('[data-jm]',m.el).forEach(x=>x.classList.remove('on'));if(!on)b.classList.add('on')});
  const sync=()=>{const t=$('#j-ty',m.el).value;
    $('#j-grat',m.el).style.display=t==='gratitude'?'block':'none';
    $('#j-refl',m.el).style.display=t==='reflection'?'block':'none'};
  $('#j-ty',m.el).onchange=sync;sync();
  $('#j-del',m.el)?.addEventListener('click',()=>{m.close();confirmDialog('Delete entry?','This cannot be undone.',()=>{mut(()=>{D.journal=D.journal.filter(x=>x.id!==j.id)});toast('Entry deleted')})});
}
PAGES.journal={
  title:'Journal',
  sub:()=>`${D.journal.length} entr${D.journal.length===1?'y':'ies'}`,
  render(){
    const v=tab.journal||'all';
    const list=[...D.journal].sort((a,b)=>b.date.localeCompare(a.date)).filter(j=>v==='all'||j.type===v);
    const last30=[...Array(30)].map((_,i)=>addDays(today(),-(29-i)));
    const head=`<div class="row wrap" style="margin-bottom:18px">
      <div class="tabs">${[['all','All'],['daily','Daily'],['gratitude','Gratitude'],['reflection','Reflections']].map(([k,l])=>`<button class="chip tab ${v===k?'on':''}" data-tab="${k}" data-tabkey="journal">${l}</button>`).join('')}</div>
      <span style="flex:1"></span><button class="btn accent" id="j-new">＋ Write entry</button></div>
    <div class="card solid" style="margin-bottom:18px">
      <div class="card-h"><h3>Mood over the last 30 days</h3></div>
      <div class="chart" style="height:96px">${last30.map(d=>{const mo=D.moods[d];
        return `<div title="${d}"><b style="height:${mo?mo*20:3}%;opacity:${mo?1:.2};background:${mo?'linear-gradient(180deg,var(--peach),var(--blush))':'var(--line)'}"></b></div>`}).join('')}</div>
      <div class="row xs faint mt"><span>${fmt(last30[0])}</span><span style="flex:1"></span><span>Today</span></div>
    </div>`;
    if(!list.length)return head+`<div class="card">${emptyState('📖','Nothing written yet','Three sentences counts. Start with how today actually felt.','<button class="btn accent mt" id="j-new2">Write today\'s entry</button>')}</div>`;
    return head+`<div class="stack" style="gap:14px">${list.map(j=>`<div class="card hover" data-jedit="${j.id}" style="cursor:pointer">
      <div class="row"><span class="eyebrow">${relDay(j.date)} · ${j.type}</span><span style="flex:1"></span>
        ${j.mood?`<span style="font-size:19px">${MOODS.find(m=>m.v===j.mood).e}</span>`:''}</div>
      ${j.title?`<h3 style="font-size:19px;margin:6px 0">${esc(j.title)}</h3>`:''}
      ${j.prompt?`<div class="sm" style="font-style:italic;color:var(--accent-deep);margin:5px 0">${esc(j.prompt)}</div>`:''}
      ${j.grateful?.some(Boolean)?`<div class="stack sm" style="gap:3px;margin:8px 0">${j.grateful.filter(Boolean).map(g=>`<div>🌸 ${esc(g)}</div>`).join('')}</div>`:''}
      ${j.body?`<div class="sm muted" style="white-space:pre-wrap">${esc(j.body)}</div>`:''}
      ${j.photos?.length?`<div class="row wrap mt" style="gap:8px">${j.photos.map(p=>`<img src="${esc(p)}" alt="" loading="lazy" style="width:88px;height:88px;object-fit:cover;border-radius:var(--r-sm)" onerror="this.style.display='none'">`).join('')}</div>`:''}
    </div>`).join('')}</div>`;
  },
  after(){
    $('#j-new')?.addEventListener('click',()=>journalModal());
    $('#j-new2')?.addEventListener('click',()=>journalModal());
    $$('[data-jedit]').forEach(b=>b.onclick=()=>journalModal(D.journal.find(j=>j.id===b.dataset.jedit)));
  }
};
</script>
<script>
/* =====================================================================
   PAGE: BUDGET
   ===================================================================== */
const EXCATS=['Housing','Groceries','Dining','Transport','Health','Shopping','Bills','Fun','Savings','Gifts','Other'];
const EXCOLORS=['#DFA8AE','#8CA383','#B0A5D4','#EFC7AE','#8E9FC4','#C88A92','#6F8768','#8E82BA','#D9A05B','#B9A6C9','#9C93A3'];
const monthOf=s=>(s||today()).slice(0,7);
function simpleModal(title,fields,onOk,sub){
  const m=modal({title,sub,confirm:'Save',body:fields.map(f=>{
    if(f.type==='select')return field(f.label,`<select class="select" data-f="${f.k}">${f.options.map(o=>`<option value="${o}" ${f.value===o?'selected':''}>${o}</option>`).join('')}</select>`);
    if(f.type==='textarea')return field(f.label,`<textarea class="ta" data-f="${f.k}" placeholder="${esc(f.ph||'')}">${esc(f.value||'')}</textarea>`);
    if(f.type==='check')return `<label class="row sm"><input type="checkbox" data-f="${f.k}" ${f.value?'checked':''}> ${esc(f.label)}</label>`;
    return field(f.label,`<input class="input" type="${f.type||'text'}" data-f="${f.k}" value="${esc(f.value??'')}" placeholder="${esc(f.ph||'')}" ${f.step?`step="${f.step}"`:''}>`);
  }).join(''),onConfirm:s=>{
    const o={};$$('[data-f]',s).forEach(el=>o[el.dataset.f]=el.type==='checkbox'?el.checked:el.value);
    return onOk(o);
  }});
  return m;
}
PAGES.budget={
  title:'Budget',
  sub:()=>{const m=monthOf();const inc=sum(D.income.filter(x=>monthOf(x.date)===m).map(x=>x.amount));
    const exp=sum(D.expenses.filter(x=>monthOf(x.date)===m).map(x=>x.amount));
    return `${money(inc-exp)} left this month`},
  render(){
    const v=tab.budget||'overview',m=monthOf();
    const inc=D.income.filter(x=>monthOf(x.date)===m),exp=D.expenses.filter(x=>monthOf(x.date)===m);
    const ti=sum(inc.map(x=>x.amount)),te=sum(exp.map(x=>x.amount));
    const byCat=EXCATS.map((c,i)=>({c,v:sum(exp.filter(x=>x.cat===c).map(x=>x.amount)),color:EXCOLORS[i]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
    const months=[...Array(6)].map((_,i)=>{const d=new Date();d.setMonth(d.getMonth()-(5-i));const k=iso(d).slice(0,7);
      return{k,label:d.toLocaleDateString(undefined,{month:'short'}),
        inc:sum(D.income.filter(x=>monthOf(x.date)===k).map(x=>x.amount)),
        exp:sum(D.expenses.filter(x=>monthOf(x.date)===k).map(x=>x.amount))}});
    const maxM=Math.max(...months.map(x=>Math.max(x.inc,x.exp)),1);
    const head=`<div class="row wrap" style="margin-bottom:18px">
      <div class="tabs">${[['overview','Overview'],['income','Income'],['expenses','Expenses'],['bills','Bills'],['savings','Savings goals']].map(([k,l])=>`<button class="chip tab ${v===k?'on':''}" data-tab="${k}" data-tabkey="budget">${l}</button>`).join('')}</div>
      <span style="flex:1"></span><button class="btn accent" id="b-new">＋ Add ${v==='income'?'income':v==='bills'?'bill':v==='savings'?'savings goal':'expense'}</button></div>`;
    if(v==='overview'){
      const total=sum(byCat.map(x=>x.v))||1;let acc=0;
      const segs=byCat.map(x=>{const frac=x.v/total,r=68,c=2*Math.PI*r,off=acc*c;acc+=frac;
        return `<circle cx="79" cy="79" r="${r}" fill="none" stroke="${x.color}" stroke-width="21"
          stroke-dasharray="${frac*c} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 79 79)"/>`}).join('');
      return head+`<div class="grid g4" style="margin-bottom:18px">
        <div class="stat"><div class="v" style="color:var(--sage-deep)">${money(ti)}</div><div class="k">Income this month</div></div>
        <div class="stat"><div class="v" style="color:var(--bad)">${money(te)}</div><div class="k">Spent this month</div></div>
        <div class="stat"><div class="v">${money(ti-te)}</div><div class="k">Remaining</div></div>
        <div class="stat"><div class="v">${ti?Math.round((ti-te)/ti*100):0}%</div><div class="k">Kept</div></div>
      </div>
      <div class="grid g2">
        <div class="card"><div class="card-h"><h3>Where it went</h3></div>
          ${byCat.length?`<div class="row" style="gap:20px;flex-wrap:wrap">
            <svg class="donut" viewBox="0 0 158 158">${segs}<circle cx="79" cy="79" r="47" fill="var(--card-solid)"/>
              <text x="79" y="75" text-anchor="middle" font-family="Fraunces" font-size="19" fill="var(--ink)">${money(te).replace(/\.\d+$/,'')}</text>
              <text x="79" y="92" text-anchor="middle" font-size="9" fill="var(--ink-faint)">THIS MONTH</text></svg>
            <div class="legend">${byCat.map(x=>`<div class="lg"><span class="dot" style="background:${x.color}"></span>
              <span>${x.c}</span><span class="sp"></span><span class="tnum">${money(x.v)}</span>
              <span class="faint tnum" style="width:38px;text-align:right">${Math.round(x.v/total*100)}%</span></div>`).join('')}</div>
          </div>`:emptyState('💰','No spending logged','Add a few expenses to see the picture.')}
        </div>
        <div class="card"><div class="card-h"><h3>Last 6 months</h3>
          <span class="sp"></span><span class="row xs faint" style="gap:10px"><span class="row" style="gap:4px"><span class="dot" style="background:var(--sage)"></span>in</span>
          <span class="row" style="gap:4px"><span class="dot" style="background:var(--blush)"></span>out</span></span></div>
          <div class="chart">${months.map(x=>`<div>
            <div class="row" style="align-items:flex-end;height:100%;gap:3px;width:100%">
              <b style="height:${x.inc/maxM*100}%;background:var(--sage)"></b>
              <b style="height:${x.exp/maxM*100}%;background:var(--blush)"></b></div>
            <span class="xs faint">${x.label}</span></div>`).join('')}</div>
        </div>
      </div>
      <div class="card mt"><div class="card-h"><h3>Bills due soon</h3><span class="sp"></span><button class="btn sm ghost" data-tab="bills" data-tabkey="budget">All bills</button></div>
        ${D.bills.length?`<div class="stack">${[...D.bills].sort((a,b)=>(a.due||'99').localeCompare(b.due||'99')).slice(0,5).map(b=>`
          <div class="list-item"><button class="check ${b.paid?'on sage':''}" data-bpaid="${b.id}">✓</button>
          <div style="flex:1"><div class="li-t">${esc(b.name)}</div><div class="xs faint">Day ${b.due} of the month${b.auto?' · autopay':''}</div></div>
          <span class="tnum" style="font-weight:600">${money(b.amount)}</span></div>`).join('')}</div>`
          :emptyState('🧾','No bills tracked','Add recurring bills so nothing sneaks up.')}
      </div>`;
    }
    if(v==='savings'){
      return head+(D.savings.length?`<div class="grid g3">${D.savings.map(s=>{const p=pct(+s.saved,+s.target);
        return `<div class="card hover">${sprig()}
          <div class="center">${ring(p,110,'',10,'var(--sage)')}</div>
          <h3 style="font-size:18px;margin:12px 0 3px;text-align:center">${esc(s.name)}</h3>
          <div class="center sm muted">${money(s.saved)} of ${money(s.target)}</div>
          ${s.by?`<div class="center xs faint mt">Target ${fmt(s.by,{month:'long',year:'numeric'})}</div>`:''}
          <div class="row mt" style="justify-content:center">
            <button class="btn sm" data-sadd="${s.id}">＋ Add money</button>
            <button class="btn sm ghost" data-sdel="${s.id}">Remove</button></div>
        </div>`}).join('')}</div>`:`<div class="card">${emptyState('🪺','No savings goals','Name what you\'re saving for — it makes the difference.')}</div>`);
    }
    if(v==='bills'){
      return head+`<div class="card solid">${D.bills.length?`<table class="t"><thead><tr><th>Paid</th><th>Bill</th><th>Amount</th><th>Due day</th><th>Autopay</th><th></th></tr></thead><tbody>
        ${[...D.bills].sort((a,b)=>(+a.due)-(+b.due)).map(b=>`<tr>
          <td><button class="check ${b.paid?'on sage':''}" data-bpaid="${b.id}">✓</button></td>
          <td style="font-weight:600">${esc(b.name)}</td><td class="tnum">${money(b.amount)}</td>
          <td>Day ${esc(b.due)}</td><td>${b.auto?'Yes':'No'}</td>
          <td style="text-align:right"><button class="x" data-bdel="${b.id}">×</button></td></tr>`).join('')}
        <tr><td></td><td style="font-weight:700">Monthly total</td><td class="tnum" style="font-weight:700">${money(sum(D.bills.map(b=>b.amount)))}</td><td colspan="3"></td></tr>
        </tbody></table>`:emptyState('🧾','No bills yet','Add rent, utilities, subscriptions — anything that repeats.')}</div>`;
    }
    const rows=v==='income'?inc:exp;
    return head+`<div class="card solid">
      <div class="card-h"><h3>${v==='income'?'Income':'Expenses'} — ${parseISO(m+'-01').toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h3>
        <span class="sp"></span><span class="chip tnum">${money(sum(rows.map(x=>x.amount)))}</span></div>
      ${rows.length?`<table class="t"><thead><tr><th>Date</th><th>${v==='income'?'Source':'What'}</th><th>Category</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody>
        ${[...rows].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr>
          <td class="faint">${fmt(x.date)}</td><td style="font-weight:600">${esc(x.name)}</td>
          <td><span class="chip xs">${esc(x.cat||'—')}</span></td>
          <td class="tnum" style="text-align:right;font-weight:600">${money(x.amount)}</td>
          <td style="text-align:right"><button class="x" data-xdel="${x.id}" data-kind="${v}">×</button></td></tr>`).join('')}
        </tbody></table>`:emptyState(v==='income'?'💵':'🧾',`No ${v} this month`,'Add an entry to start tracking.')}
    </div>`;
  },
  after(){
    const v=tab.budget||'overview';
    $('#b-new').onclick=()=>{
      if(v==='savings')return simpleModal('New savings goal',[{k:'name',label:'What for',ph:'Emergency fund'},
        {k:'target',label:'Target amount',type:'number',step:'0.01'},{k:'saved',label:'Saved so far',type:'number',step:'0.01',value:0},
        {k:'by',label:'Target date',type:'date'}],o=>{if(!o.name||!o.target){toast('Add a name and target');return false}
        mut(()=>D.savings.push({id:uid(),name:o.name,target:+o.target,saved:+o.saved||0,by:o.by||null}));toast('Savings goal added')});
      if(v==='bills')return simpleModal('New bill',[{k:'name',label:'Bill',ph:'Electricity'},
        {k:'amount',label:'Amount',type:'number',step:'0.01'},{k:'due',label:'Due day of month',type:'number',value:1},
        {k:'auto',label:'Paid automatically',type:'check'}],o=>{if(!o.name){toast('Name the bill');return false}
        mut(()=>D.bills.push({id:uid(),name:o.name,amount:+o.amount||0,due:+o.due||1,auto:o.auto,paid:false}));toast('Bill added')});
      const isInc=v==='income';
      simpleModal(isInc?'Add income':'Add expense',[{k:'name',label:isInc?'Source':'What was it',ph:isInc?'Etsy sales':'Groceries'},
        {k:'amount',label:'Amount',type:'number',step:'0.01'},{k:'date',label:'Date',type:'date',value:today()},
        {k:'cat',label:'Category',type:'select',options:isInc?['Salary','Freelance','Shop sales','Gift','Refund','Other']:EXCATS}],
        o=>{if(!o.name||!o.amount){toast('Add a name and amount');return false}
          mut(()=>(isInc?D.income:D.expenses).push({id:uid(),name:o.name,amount:+o.amount,date:o.date||today(),cat:o.cat}));
          toast(isInc?'Income added':'Expense added')});
    };
    $$('[data-bpaid]').forEach(b=>b.onclick=()=>mut(()=>{const x=D.bills.find(y=>y.id===b.dataset.bpaid);x.paid=!x.paid}));
    $$('[data-bdel]').forEach(b=>b.onclick=()=>mut(()=>{D.bills=D.bills.filter(x=>x.id!==b.dataset.bdel)}));
    $$('[data-xdel]').forEach(b=>b.onclick=()=>mut(()=>{const k=b.dataset.kind==='income'?'income':'expenses';
      D[k]=D[k].filter(x=>x.id!==b.dataset.xdel)}));
    $$('[data-sdel]').forEach(b=>b.onclick=()=>mut(()=>{D.savings=D.savings.filter(x=>x.id!==b.dataset.sdel)}));
    $$('[data-sadd]').forEach(b=>b.onclick=()=>simpleModal('Add to savings',[{k:'amt',label:'Amount to add',type:'number',step:'0.01'}],
      o=>{mut(()=>{const s=D.savings.find(x=>x.id===b.dataset.sadd);s.saved=+s.saved+(+o.amt||0);checkBadges()});toast('Savings updated')}));
  }
};

/* =====================================================================
   PAGE: MEAL PLANNER
   ===================================================================== */
const SLOTS=[['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner'],['snack','Snack']];
PAGES.meals={
  title:'Meal planner',
  sub:()=>`${D.grocery.filter(g=>!g.done).length} items on the grocery list`,
  render(){
    const v=tab.meals||'week',s=startOfWeek(mealWeek||today());
    const days=[...Array(7)].map((_,i)=>addDays(s,i));
    const head=`<div class="row wrap" style="margin-bottom:18px">
      <div class="tabs">${[['week','Weekly meals'],['grocery','Grocery list'],['pantry','Pantry'],['recipes','Recipes']].map(([k,l])=>`<button class="chip tab ${v===k?'on':''}" data-tab="${k}" data-tabkey="meals">${l}</button>`).join('')}</div>
      <span style="flex:1"></span>
      ${v==='week'?`<button class="btn icon" data-mw="-7">‹</button><button class="btn sm" data-mw="0">This week</button><button class="btn icon" data-mw="7">›</button>
        <button class="btn" id="m-genlist">Build grocery list</button>`:''}
      ${v==='recipes'?`<button class="btn accent" id="m-newrec">＋ New recipe</button>`:''}
      ${v==='pantry'?`<button class="btn accent" id="m-newpan">＋ Add item</button>`:''}
      ${v==='grocery'?`<button class="btn accent" id="m-newgro">＋ Add item</button>`:''}</div>`;
    if(v==='week'){
      return head+`<div class="card solid" style="overflow-x:auto">
        <div style="min-width:660px;display:grid;grid-template-columns:96px repeat(4,1fr);gap:8px">
          <div></div>${SLOTS.map(([,l])=>`<div class="cal-dow">${l}</div>`).join('')}
          ${days.map(d=>`<div class="row" style="min-width:0"><div>
            <div class="xs faint">${fmt(d,{weekday:'short'})}</div>
            <div class="display" style="font-size:17px;${d===today()?'color:var(--accent-deep)':''}">${parseISO(d).getDate()}</div></div></div>
            ${SLOTS.map(([k])=>{const val=(D.meals[d]||{})[k]||'';
              return `<button class="list-item" data-meal="${d}" data-slot="${k}" style="min-height:56px;align-items:center">
                <span class="li-t ${val?'':'faint'}" style="font-weight:${val?600:400}">${val?esc(val):'＋'}</span></button>`}).join('')}`).join('')}
        </div></div>
        <div class="card mt"><div class="card-h"><h3>Favourite recipes</h3><span class="sp"></span>
          <button class="btn sm ghost" data-tab="recipes" data-tabkey="meals">All recipes</button></div>
          ${D.recipes.length?`<div class="row wrap">${D.recipes.slice(0,10).map(r=>`<button class="chip" data-recquick="${r.id}">${esc(r.name)}</button>`).join('')}</div>
          <div class="xs faint mt">Tap a recipe then a slot to plan it.</div>`:emptyState('🍽','No recipes saved','Save the meals you actually cook.')}
        </div>`;
    }
    if(v==='grocery'){
      const open=D.grocery.filter(g=>!g.done),done=D.grocery.filter(g=>g.done);
      const byAisle={};open.forEach(g=>(byAisle[g.aisle||'Other']=byAisle[g.aisle||'Other']||[]).push(g));
      return head+`<div class="grid g2"><div class="card solid">
        <div class="card-h"><h3>To buy</h3><span class="sp"></span><span class="chip">${open.length}</span></div>
        ${open.length?Object.keys(byAisle).sort().map(a=>`<div style="margin-bottom:14px">
          <div class="eyebrow" style="margin-bottom:7px">${esc(a)}</div>
          <div class="stack">${byAisle[a].map(g=>`<div class="list-item"><button class="check" data-gtog="${g.id}">✓</button>
            <div class="li-t">${esc(g.name)}</div>${g.qty?`<span class="xs faint">${esc(g.qty)}</span>`:''}
            <button class="x" data-gdel2="${g.id}">×</button></div>`).join('')}</div></div>`).join('')
          :emptyState('🛒','List is empty','Add items, or build the list from your meal plan.')}
      </div>
      <div class="card">
        <div class="card-h"><h3>In the cart</h3><span class="sp"></span>${done.length?`<button class="btn sm ghost" id="m-clear">Clear</button>`:''}</div>
        ${done.length?`<div class="stack">${done.map(g=>`<div class="list-item done"><button class="check on sage" data-gtog="${g.id}">✓</button>
          <div class="li-t">${esc(g.name)}</div></div>`).join('')}</div>`:`<div class="empty sm">Nothing checked off yet.</div>`}
      </div></div>`;
    }
    if(v==='pantry'){
      const low=D.pantry.filter(p=>p.low);
      return head+`<div class="card solid">
        ${low.length?`<div class="card" style="background:color-mix(in srgb,var(--warn) 12%,transparent);margin-bottom:14px;padding:13px">
          <div class="sm"><b>Running low:</b> ${low.map(p=>esc(p.name)).join(', ')}
          <button class="btn sm mt" id="m-lowtolist">Add these to grocery list</button></div></div>`:''}
        ${D.pantry.length?`<table class="t"><thead><tr><th>Item</th><th>Amount</th><th>Where</th><th>Low</th><th></th></tr></thead><tbody>
          ${D.pantry.map(p=>`<tr><td style="font-weight:600">${esc(p.name)}</td><td>${esc(p.qty||'')}</td>
            <td class="faint">${esc(p.where||'')}</td>
            <td><button class="check ${p.low?'on':''}" data-plow="${p.id}">!</button></td>
            <td style="text-align:right"><button class="x" data-pdel="${p.id}">×</button></td></tr>`).join('')}</tbody></table>`
          :emptyState('🥫','Pantry is empty','Track staples so you stop buying duplicates.')}
      </div>`;
    }
    return head+(D.recipes.length?`<div class="grid g3">${D.recipes.map(r=>`<div class="card hover">
      <div class="row"><h3 style="font-size:18px;flex:1">${esc(r.name)}</h3><button class="x" data-rdel="${r.id}">×</button></div>
      <div class="row wrap xs faint" style="gap:8px;margin:5px 0 10px">${r.time?`<span>⏱ ${esc(r.time)}</span>`:''}${r.serves?`<span>🍽 serves ${esc(r.serves)}</span>`:''}</div>
      ${r.ingredients?`<div class="eyebrow">Ingredients</div><div class="sm muted" style="white-space:pre-wrap;margin:5px 0 10px">${esc(r.ingredients)}</div>`:''}
      ${r.steps?`<div class="eyebrow">Method</div><div class="sm muted" style="white-space:pre-wrap">${esc(r.steps)}</div>`:''}
      <button class="btn sm mt block" data-rtolist="${r.id}">Add ingredients to grocery list</button>
    </div>`).join('')}</div>`:`<div class="card">${emptyState('📗','No recipes yet','Save the ten meals you cook on repeat.','<button class="btn accent mt" id="m-newrec2">Add a recipe</button>')}</div>`);
  },
  after(){
    $$('[data-mw]').forEach(b=>b.onclick=()=>{mealWeek=+b.dataset.mw===0?today():addDays(mealWeek||today(),+b.dataset.mw);render()});
    $$('[data-meal]').forEach(b=>b.onclick=()=>{
      const d=b.dataset.meal,k=b.dataset.slot;
      if(pendingRecipe){mut(()=>{D.meals[d]=D.meals[d]||{};D.meals[d][k]=pendingRecipe;checkBadges()});pendingRecipe=null;return toast('Meal planned')}
      simpleModal(`${SLOTS.find(s=>s[0]===k)[1]} — ${relDay(d)}`,[{k:'v',label:'What are you having',value:(D.meals[d]||{})[k]||'',ph:'Lemon chicken and rice'}],
        o=>{mut(()=>{D.meals[d]=D.meals[d]||{};o.v.trim()?D.meals[d][k]=o.v.trim():delete D.meals[d][k];checkBadges()})});
    });
    $$('[data-recquick]').forEach(b=>b.onclick=()=>{pendingRecipe=D.recipes.find(r=>r.id===b.dataset.recquick).name;
      toast('Now tap a meal slot to plan it')});
    $('#m-genlist')?.addEventListener('click',()=>{
      const s=startOfWeek(mealWeek||today());const names=new Set();
      [...Array(7)].forEach((_,i)=>{const m=D.meals[addDays(s,i)]||{};Object.values(m).forEach(v=>v&&names.add(v))});
      if(!names.size)return toast('Plan some meals first');
      let added=0;
      mut(()=>names.forEach(n=>{const r=D.recipes.find(x=>x.name.toLowerCase()===n.toLowerCase());
        if(r&&r.ingredients)r.ingredients.split('\n').map(x=>x.trim()).filter(Boolean).forEach(ing=>{
          if(!D.grocery.some(g=>!g.done&&g.name.toLowerCase()===ing.toLowerCase())){D.grocery.push({id:uid(),name:ing,aisle:'From recipes',done:false});added++}});
        else if(!D.grocery.some(g=>!g.done&&g.name.toLowerCase()===n.toLowerCase())){D.grocery.push({id:uid(),name:`Ingredients for ${n}`,aisle:'Meal plan',done:false});added++}}));
      toast(`${added} item${added===1?'':'s'} added to your grocery list`);
    });
    const gro=()=>simpleModal('Add grocery item',[{k:'name',label:'Item'},{k:'qty',label:'Amount',ph:'2 lbs'},
      {k:'aisle',label:'Section',type:'select',options:['Produce','Meat & fish','Dairy','Bakery','Pantry','Frozen','Household','Other']}],
      o=>{if(!o.name){toast('Name the item');return false}mut(()=>D.grocery.push({id:uid(),name:o.name,qty:o.qty,aisle:o.aisle,done:false}))});
    $('#m-newgro')?.addEventListener('click',gro);
    $$('[data-gtog]').forEach(b=>b.onclick=()=>mut(()=>{const g=D.grocery.find(x=>x.id===b.dataset.gtog);g.done=!g.done}));
    $$('[data-gdel2]').forEach(b=>b.onclick=()=>mut(()=>{D.grocery=D.grocery.filter(x=>x.id!==b.dataset.gdel2)}));
    $('#m-clear')?.addEventListener('click',()=>mut(()=>{D.grocery=D.grocery.filter(g=>!g.done)}));
    $('#m-newpan')?.addEventListener('click',()=>simpleModal('Add pantry item',[{k:'name',label:'Item'},{k:'qty',label:'Amount',ph:'1 bag'},
      {k:'where',label:'Where it lives',ph:'Top shelf'}],o=>{if(!o.name){toast('Name the item');return false}
      mut(()=>D.pantry.push({id:uid(),name:o.name,qty:o.qty,where:o.where,low:false}))}));
    $$('[data-plow]').forEach(b=>b.onclick=()=>mut(()=>{const p=D.pantry.find(x=>x.id===b.dataset.plow);p.low=!p.low}));
    $$('[data-pdel]').forEach(b=>b.onclick=()=>mut(()=>{D.pantry=D.pantry.filter(x=>x.id!==b.dataset.pdel)}));
    $('#m-lowtolist')?.addEventListener('click',()=>{mut(()=>D.pantry.filter(p=>p.low).forEach(p=>{
      if(!D.grocery.some(g=>!g.done&&g.name===p.name))D.grocery.push({id:uid(),name:p.name,aisle:'Pantry',done:false})}));toast('Added to grocery list')});
    const rec=()=>simpleModal('New recipe',[{k:'name',label:'Recipe name'},{k:'time',label:'Time',ph:'35 min'},
      {k:'serves',label:'Serves',ph:'4'},{k:'ingredients',label:'Ingredients (one per line)',type:'textarea'},
      {k:'steps',label:'Method',type:'textarea'}],o=>{if(!o.name){toast('Name the recipe');return false}
      mut(()=>D.recipes.unshift({id:uid(),...o}));toast('Recipe saved')});
    $('#m-newrec')?.addEventListener('click',rec);$('#m-newrec2')?.addEventListener('click',rec);
    $$('[data-rdel]').forEach(b=>b.onclick=()=>mut(()=>{D.recipes=D.recipes.filter(x=>x.id!==b.dataset.rdel)}));
    $$('[data-rtolist]').forEach(b=>b.onclick=()=>{const r=D.recipes.find(x=>x.id===b.dataset.rtolist);
      if(!r.ingredients)return toast('This recipe has no ingredients listed');
      mut(()=>r.ingredients.split('\n').map(x=>x.trim()).filter(Boolean).forEach(i=>D.grocery.push({id:uid(),name:i,aisle:'From recipes',done:false})));
      toast('Ingredients added to grocery list')});
  }
};
let mealWeek=null,pendingRecipe=null;

/* =====================================================================
   PAGE: FITNESS
   ===================================================================== */
PAGES.fitness={
  title:'Fitness',
  sub:()=>`${D.workouts.filter(w=>w.date===today()).length?'Workout logged today':'No workout logged today'}`,
  render(){
    const t=today(),v=tab.fitness||'overview';
    const w14=[...Array(14)].map((_,i)=>addDays(t,-(13-i)));
    const weights=[...D.weight].sort((a,b)=>a.date.localeCompare(b.date));
    const maxW=Math.max(...weights.map(x=>+x.kg),1),minW=Math.min(...weights.map(x=>+x.kg),maxW);
    const head=`<div class="row wrap" style="margin-bottom:18px">
      <div class="tabs">${[['overview','Overview'],['workouts','Workouts'],['body','Weight & measurements'],['sleep','Sleep & steps']].map(([k,l])=>`<button class="chip tab ${v===k?'on':''}" data-tab="${k}" data-tabkey="fitness">${l}</button>`).join('')}</div>
      <span style="flex:1"></span>
      ${v==='workouts'?`<button class="btn accent" id="f-new">＋ Log workout</button>`:''}
      ${v==='body'?`<button class="btn accent" id="f-weigh">＋ Log weight</button><button class="btn" id="f-measure">＋ Measurements</button>`:''}</div>`;
    if(v==='overview'){
      return head+`<div class="grid g4" style="margin-bottom:18px">
        <div class="stat"><div class="v">${D.workouts.filter(x=>x.date>=addDays(t,-7)).length}</div><div class="k">Workouts this week</div></div>
        <div class="stat"><div class="v">${(D.steps[t]||0).toLocaleString()}</div><div class="k">Steps today</div></div>
        <div class="stat"><div class="v">${D.sleep[t]||'—'}${D.sleep[t]?'h':''}</div><div class="k">Sleep last night</div></div>
        <div class="stat"><div class="v">${weights.length?weights[weights.length-1].kg:'—'}</div><div class="k">Latest weight</div></div>
      </div>
      <div class="grid g2">
        <div class="card"><div class="card-h"><h3>Water</h3><span class="sp"></span><span class="chip tnum">${D.water[t]||0}/${D.settings.waterGoal}</span></div>
          <div class="water-row">${[...Array(D.settings.waterGoal)].map((_,i)=>`<button class="glass ${i<(D.water[t]||0)?'on':''}" data-water="${i+1}"></button>`).join('')}</div>
          <div class="mt">${bar(pct(D.water[t]||0,D.settings.waterGoal))}</div></div>
        <div class="card"><div class="card-h"><h3>Steps</h3><span class="sp"></span><button class="btn sm" id="f-steps">Log today</button></div>
          <div class="chart" style="height:120px">${w14.map(d=>`<div title="${d}"><b style="height:${clamp((D.steps[d]||0)/D.settings.stepGoal*100,2,100)}%"></b>
            <span class="xs faint" style="font-size:9px">${parseISO(d).getDate()}</span></div>`).join('')}</div></div>
        <div class="card"><div class="card-h"><h3>Sleep</h3><span class="sp"></span><button class="btn sm" id="f-sleep">Log last night</button></div>
          <div class="chart" style="height:120px">${w14.map(d=>`<div title="${d}"><b style="height:${clamp((D.sleep[d]||0)/12*100,2,100)}%;background:linear-gradient(180deg,var(--lav),var(--info))"></b>
            <span class="xs faint" style="font-size:9px">${parseISO(d).getDate()}</span></div>`).join('')}</div>
          <div class="xs faint mt">Goal ${D.settings.sleepGoal}h · 14-day view</div></div>
        <div class="card"><div class="card-h"><h3>Recent workouts</h3></div>
          ${D.workouts.length?`<div class="stack">${[...D.workouts].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(w=>`
            <div class="list-item"><div style="flex:1"><div class="li-t">${esc(w.type)}</div>
            <div class="xs faint">${relDay(w.date)} · ${esc(w.mins)} min${w.notes?' · '+esc(w.notes):''}</div></div>
            <span class="chip xs">${esc(w.how||'')}</span></div>`).join('')}</div>`:emptyState('💪','Nothing logged','Even a ten-minute walk counts.')}
        </div>
      </div>`;
    }
    if(v==='workouts'){
      return head+`<div class="card solid">${D.workouts.length?`<table class="t"><thead><tr><th>Date</th><th>Workout</th><th>Minutes</th><th>How it felt</th><th>Notes</th><th></th></tr></thead><tbody>
        ${[...D.workouts].sort((a,b)=>b.date.localeCompare(a.date)).map(w=>`<tr data-editrow data-wedit="${w.id}"><td class="faint">${fmt(w.date)}</td>
          <td style="font-weight:600">${esc(w.type)}</td><td class="tnum">${esc(w.mins)}</td><td>${esc(w.how||'')}</td>
          <td class="faint">${esc(w.notes||'')}</td><td style="text-align:right"><button class="x" data-wdel="${w.id}">×</button></td></tr>`).join('')}
        </tbody></table>`:emptyState('💪','No workouts yet','Log the first one — consistency beats intensity.','<button class="btn accent mt" id="f-new2">Log a workout</button>')}</div>`;
    }
    if(v==='body'){
      return head+`<div class="grid g2">
        <div class="card"><div class="card-h"><h3>Weight trend</h3></div>
          ${weights.length>1?`<svg viewBox="0 0 320 130" style="width:100%;height:150px">
            <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"
              points="${weights.map((w,i)=>`${i/(weights.length-1)*310+5},${120-((+w.kg-minW)/((maxW-minW)||1))*105}`).join(' ')}"/>
            ${weights.map((w,i)=>`<circle cx="${i/(weights.length-1)*310+5}" cy="${120-((+w.kg-minW)/((maxW-minW)||1))*105}" r="3.5" fill="var(--accent)"/>`).join('')}
          </svg>
          <div class="row xs faint"><span>${fmt(weights[0].date)}</span><span style="flex:1"></span><span>${fmt(weights[weights.length-1].date)}</span></div>
          <div class="row mt"><span class="chip">Latest ${weights[weights.length-1].kg}</span>
            <span class="chip">Change ${(weights[weights.length-1].kg-weights[0].kg>0?'+':'')}${(weights[weights.length-1].kg-weights[0].kg).toFixed(1)}</span></div>`
          :emptyState('⚖️','Not enough data','Log weight twice to see a trend line.')}
        </div>
        <div class="card"><div class="card-h"><h3>Measurements</h3></div>
          ${D.measures.length?`<table class="t"><thead><tr><th>Date</th><th>Chest</th><th>Waist</th><th>Hips</th><th>Arm</th><th>Thigh</th><th></th></tr></thead><tbody>
            ${[...D.measures].sort((a,b)=>b.date.localeCompare(a.date)).map(m=>`<tr data-editrow data-medit="${m.id}"><td class="faint">${fmt(m.date)}</td>
              <td>${esc(m.chest||'')}</td><td>${esc(m.waist||'')}</td><td>${esc(m.hips||'')}</td><td>${esc(m.arm||'')}</td><td>${esc(m.thigh||'')}</td>
              <td style="text-align:right"><button class="x" data-mdel="${m.id}">×</button></td></tr>`).join('')}</tbody></table>`
            :emptyState('📏','No measurements','A monthly check-in shows what the scale misses.')}
        </div>
        <div class="card"><div class="card-h"><h3>Weight log</h3></div>
          ${weights.length?`<div class="stack">${[...weights].reverse().map(w=>`<div class="list-item" data-editrow data-wgedit="${w.id}">
            <div class="li-t tnum">${esc(w.kg)}</div><span class="xs faint">${relDay(w.date)}</span>
            <button class="x" data-wgdel="${w.id}">×</button></div>`).join('')}</div>`:`<div class="empty sm">Nothing logged yet.</div>`}
        </div></div>`;
    }
    return head+`<div class="grid g2">
      <div class="card"><div class="card-h"><h3>Sleep log</h3><span class="sp"></span><button class="btn sm accent" id="f-sleep">Log</button></div>
        <div class="stack">${w14.slice().reverse().map(d=>`<div class="list-item"><div class="li-t">${relDay(d)}</div>
          <div class="bar" style="flex:1"><i style="width:${clamp((D.sleep[d]||0)/12*100,0,100)}%;background:linear-gradient(90deg,var(--lav),var(--info))"></i></div>
          <span class="tnum xs" style="width:44px;text-align:right">${D.sleep[d]?D.sleep[d]+'h':'—'}</span></div>`).join('')}</div></div>
      <div class="card"><div class="card-h"><h3>Steps log</h3><span class="sp"></span><button class="btn sm accent" id="f-steps">Log</button></div>
        <div class="stack">${w14.slice().reverse().map(d=>`<div class="list-item"><div class="li-t">${relDay(d)}</div>
          <div class="bar" style="flex:1"><i style="width:${clamp((D.steps[d]||0)/D.settings.stepGoal*100,0,100)}%"></i></div>
          <span class="tnum xs" style="width:56px;text-align:right">${(D.steps[d]||0).toLocaleString()}</span></div>`).join('')}</div></div>
    </div>`;
  },
  after(){
    $$('[data-water]').forEach(b=>b.onclick=()=>mut(()=>{const n=+b.dataset.water;D.water[today()]=(D.water[today()]===n)?n-1:n;checkBadges()}));
    const nw=(w)=>simpleModal(w?'Edit workout':'Log workout',[{k:'type',label:'What did you do',ph:'Strength, walk, yoga',value:w?.type},
      {k:'mins',label:'Minutes',type:'number',value:w?w.mins:30},{k:'date',label:'Date',type:'date',value:w?w.date:today()},
      {k:'how',label:'How it felt',type:'select',options:['Easy','Good','Hard','Brutal'],value:w?.how},{k:'notes',label:'Notes',value:w?.notes}],
      o=>{if(!o.type){toast('What kind of workout?');return false}
        mut(()=>{if(w)Object.assign(w,{...o,mins:+o.mins||0});else D.workouts.push({id:uid(),...o,mins:+o.mins||0})});
        toast(w?'Workout updated':'Workout logged')});
    $('#f-new')?.addEventListener('click',()=>nw());$('#f-new2')?.addEventListener('click',()=>nw());
    const nweigh=(w)=>simpleModal(w?'Edit weight':'Log weight',[{k:'kg',label:'Weight',type:'number',step:'0.1',value:w?.kg},
      {k:'date',label:'Date',type:'date',value:w?w.date:today()}],o=>{if(!o.kg){toast('Enter a number');return false}
      mut(()=>{if(w){w.kg=+o.kg;w.date=o.date||today()}else D.weight.push({id:uid(),kg:+o.kg,date:o.date||today()})})});
    $('#f-weigh')?.addEventListener('click',()=>nweigh());
    const nmeasure=(m)=>simpleModal(m?'Edit measurements':'Measurements',[{k:'date',label:'Date',type:'date',value:m?m.date:today()},
      {k:'chest',label:'Chest',value:m?.chest},{k:'waist',label:'Waist',value:m?.waist},{k:'hips',label:'Hips',value:m?.hips},
      {k:'arm',label:'Arm',value:m?.arm},{k:'thigh',label:'Thigh',value:m?.thigh}],
      o=>{mut(()=>{if(m)Object.assign(m,o);else D.measures.push({id:uid(),...o})})});
    $('#f-measure')?.addEventListener('click',()=>nmeasure());
    $('#f-steps')?.addEventListener('click',()=>simpleModal('Log steps',[{k:'n',label:'Steps',type:'number',value:D.steps[today()]||''},
      {k:'date',label:'Date',type:'date',value:today()}],o=>{mut(()=>D.steps[o.date||today()]=+o.n||0)}));
    $('#f-sleep')?.addEventListener('click',()=>simpleModal('Log sleep',[{k:'h',label:'Hours slept',type:'number',step:'0.5',value:D.sleep[today()]||''},
      {k:'date',label:'Night of',type:'date',value:today()}],o=>{mut(()=>D.sleep[o.date||today()]=+o.h||0)}));
    $$('[data-wdel]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();mut(()=>{D.workouts=D.workouts.filter(x=>x.id!==b.dataset.wdel)})});
    $$('[data-wgdel]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();mut(()=>{D.weight=D.weight.filter(x=>x.id!==b.dataset.wgdel)})});
    $$('[data-mdel]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();mut(()=>{D.measures=D.measures.filter(x=>x.id!==b.dataset.mdel)})});
    $$('[data-wedit]').forEach(tr=>tr.onclick=(e)=>{if(e.target.closest('[data-wdel]'))return;const w=D.workouts.find(x=>x.id===tr.dataset.wedit);if(w)nw(w)});
    $$('[data-wgedit]').forEach(el=>el.onclick=(e)=>{if(e.target.closest('[data-wgdel]'))return;const w=D.weight.find(x=>x.id===el.dataset.wgedit);if(w)nweigh(w)});
    $$('[data-medit]').forEach(tr=>tr.onclick=(e)=>{if(e.target.closest('[data-mdel]'))return;const m=D.measures.find(x=>x.id===tr.dataset.medit);if(m)nmeasure(m)});
  }
};
</script>
<script>
/* =====================================================================
   PAGE: CLEANING
   ===================================================================== */
const CHORE_SEED=[
  {name:'Make the beds',freq:'daily'},{name:'Kitchen counters and sink',freq:'daily'},
  {name:'Dishes away',freq:'daily'},{name:'Ten-minute tidy',freq:'daily'},
  {name:'Vacuum main rooms',freq:'weekly'},{name:'Bathrooms',freq:'weekly'},
  {name:'Change bedding',freq:'weekly'},{name:'Laundry and put away',freq:'weekly'},
  {name:'Mop floors',freq:'weekly'},{name:'Wipe out the fridge',freq:'monthly'},
  {name:'Dust baseboards and vents',freq:'monthly'},{name:'Wash windows',freq:'monthly'},
  {name:'Declutter one drawer',freq:'monthly'},{name:'Deep clean the oven',freq:'monthly'},
];
const ROOM_SEED=['Kitchen','Living room','Bedroom','Bathroom','Entryway','Office'];
PAGES.cleaning={
  title:'Cleaning schedule',
  sub:()=>{const d=D.chores.filter(c=>c.freq==='daily');return `${d.filter(c=>(c.log||[]).includes(today())).length} of ${d.length} daily chores done`},
  render(){
    const t=today(),wk=startOfWeek(t),mo=t.slice(0,7);
    const doneIn=(c,scope)=>{const l=c.log||[];
      if(scope==='daily')return l.includes(t);
      if(scope==='weekly')return l.some(d=>d>=wk);
      return l.some(d=>d.slice(0,7)===mo)};
    const sec=(freq,title,note)=>{
      const list=D.chores.filter(c=>c.freq===freq);
      const done=list.filter(c=>doneIn(c,freq)).length;
      return `<div class="card hover">
        <div class="card-h"><h3>${title}</h3><span class="sp"></span><span class="chip">${done}/${list.length}</span></div>
        <div class="xs faint" style="margin-bottom:11px">${note}</div>
        ${list.length?`<div class="stack">${list.map(c=>`<div class="list-item ${doneIn(c,freq)?'done':''}">
          <button class="check ${doneIn(c,freq)?'on sage':''}" data-clog="${c.id}" data-freq="${freq}">✓</button>
          <div class="li-t">${esc(c.name)}</div>
          ${c.room?`<span class="chip xs">${esc(c.room)}</span>`:''}
          <button class="x" data-cdel="${c.id}">×</button></div>`).join('')}</div>`
          :`<div class="empty sm">Nothing here yet.</div>`}
        <div class="mt">${bar(pct(done,list.length||1))}</div>
      </div>`};
    return `<div class="row wrap" style="margin-bottom:18px">
      <span class="chip">🏡 ${pct(D.chores.filter(c=>doneIn(c,c.freq)).length,D.chores.length||1)}% of the house handled</span>
      <span style="flex:1"></span>
      ${!D.chores.length?`<button class="btn" id="cl-seed">Use a starter schedule</button>`:''}
      <button class="btn accent" id="cl-new">＋ New chore</button>
      <button class="btn" id="cl-room">＋ Room checklist</button></div>
      <div class="grid g3">${sec('daily','Daily','Resets every morning.')}${sec('weekly','Weekly','Resets Monday.')}${sec('monthly','Monthly deep clean','Resets on the first.')}</div>
      ${D.rooms.length?`<div class="grid g3 mt">${D.rooms.map(r=>`<div class="card">
        <div class="row"><h3 style="font-size:17px;flex:1">${esc(r.name)}</h3><button class="x" data-rmdel="${r.id}">×</button></div>
        <div class="stack mt">${(r.items||[]).map((it,i)=>`<button class="row sm" data-rmtog="${r.id}" data-i="${i}" style="text-align:left">
          <span class="check ${it.done?'on sage':''}" style="width:17px;height:17px;flex:0 0 17px;font-size:10px">✓</span>
          <span style="${it.done?'text-decoration:line-through;opacity:.55':''}">${esc(it.text)}</span></button>`).join('')}</div>
        <div class="mt">${bar(pct((r.items||[]).filter(i=>i.done).length,(r.items||[]).length||1))}</div>
        <button class="btn sm ghost mt block" data-rmreset="${r.id}">Reset checklist</button>
      </div>`).join('')}</div>`:''}`;
  },
  after(){
    $('#cl-seed')?.addEventListener('click',()=>{mut(()=>{CHORE_SEED.forEach(c=>D.chores.push({id:uid(),...c,log:[]}));
      ROOM_SEED.forEach(n=>D.rooms.push({id:uid(),name:n,items:[]}))});toast('Starter schedule added — edit it to fit your home')});
    $('#cl-new')?.addEventListener('click',()=>simpleModal('New chore',[{k:'name',label:'Chore'},
      {k:'freq',label:'How often',type:'select',options:['daily','weekly','monthly']},{k:'room',label:'Room',ph:'Optional'}],
      o=>{if(!o.name){toast('Name the chore');return false}mut(()=>D.chores.push({id:uid(),name:o.name,freq:o.freq,room:o.room,log:[]}))}));
    $('#cl-room')?.addEventListener('click',()=>simpleModal('New room checklist',[{k:'name',label:'Room'},
      {k:'items',label:'Steps (one per line)',type:'textarea',ph:'Clear surfaces\nWipe down\nVacuum\nTake out bin'}],
      o=>{if(!o.name){toast('Name the room');return false}
      mut(()=>D.rooms.push({id:uid(),name:o.name,items:(o.items||'').split('\n').map(x=>x.trim()).filter(Boolean).map(t=>({text:t,done:false}))}))}));
    $$('[data-clog]').forEach(b=>b.onclick=()=>mut(()=>{
      const c=D.chores.find(x=>x.id===b.dataset.clog);c.log=c.log||[];
      const f=b.dataset.freq,t=today(),wk=startOfWeek(t),mo=t.slice(0,7);
      const hit=f==='daily'?c.log.find(d=>d===t):f==='weekly'?c.log.find(d=>d>=wk):c.log.find(d=>d.slice(0,7)===mo);
      hit?c.log.splice(c.log.indexOf(hit),1):c.log.push(t);
    }));
    $$('[data-cdel]').forEach(b=>b.onclick=()=>mut(()=>{D.chores=D.chores.filter(x=>x.id!==b.dataset.cdel)}));
    $$('[data-rmdel]').forEach(b=>b.onclick=()=>mut(()=>{D.rooms=D.rooms.filter(x=>x.id!==b.dataset.rmdel)}));
    $$('[data-rmtog]').forEach(b=>b.onclick=()=>mut(()=>{const r=D.rooms.find(x=>x.id===b.dataset.rmtog);
      r.items[+b.dataset.i].done=!r.items[+b.dataset.i].done}));
    $$('[data-rmreset]').forEach(b=>b.onclick=()=>mut(()=>{const r=D.rooms.find(x=>x.id===b.dataset.rmreset);
      (r.items||[]).forEach(i=>i.done=false)}));
  }
};

        <h3 style="font-size:18px;margin-top:3px">${esc(c.name)}</h3></div><button class="x" data-hdel="contacts" data-id="${c.id}">×</button></div>

      if(v==='maint')return simpleModal('Add maintenance reminder',[{k:'name',label:'Task',ph:'Change HVAC filter'},

      if(v==='subs')return simpleModal('Add subscription',[{k:'name',label:'Service'},{k:'amount',label:'Amount',type:'number',step:'0.01'},

        o=>{if(!o.name){toast('Name the service');return false}mut(()=>D.subs.push({id:uid(),...o,amount:+o.amount||0}))});
      if(v==='warranty')return simpleModal('Add warranty',[{k:'name',label:'Item'},{k:'bought',label:'Purchase date',type:'date'},
        {k:'ends',label:'Warranty ends',type:'date'},{k:'receipt',label:'Where the receipt is'}],
        o=>{if(!o.name){toast('Name the item');return false}mut(()=>D.warranty.push({id:uid(),...o}))});
      simpleModal('Add emergency contact',[{k:'name',label:'Name'},{k:'role',label:'Who they are',ph:'Doctor, plumber, neighbour'},
        {k:'phone',label:'Phone'},{k:'notes',label:'Notes'}],o=>{if(!o.name){toast('Add a name');return false}
        mut(()=>D.contacts.push({id:uid(),...o}))});

    $$('[data-hdel]').forEach(b=>b.onclick=()=>mut(()=>{const k=b.dataset.hdel;D[k]=D[k].filter(x=>x.id!==b.dataset.id)}));

};
function nextDue(m){if(!m.last)return today();const d=parseISO(m.last);d.setMonth(d.getMonth()+(+m.every||3));return iso(d)}

          ${n.type==='checklist'?`<div class="stack" style="gap:4px">${(n.items||[]).map((it,i)=>`
            <button class="row sm" data-nitem="${n.id}" data-i="${i}" data-stop style="text-align:left">
              <span class="check ${it.done?'on sage':''}" style="width:16px;height:16px;flex:0 0 16px;font-size:9px">✓</span>
              <span style="${it.done?'text-decoration:line-through;opacity:.55':''}">${esc(it.text)}</span></button>`).join('')}</div>`
            :`<div class="sm muted" style="white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden">${esc(n.body||'')}</div>`}
          <div class="xs faint mt">${relDay(n.date)}</div>
        </div>`).join('')}</div>`}`;
  },
  after(){
    const q=$('#n-q');if(q)q.oninput=()=>{nq=q.value;const p=q.selectionStart;render();$('#n-q').focus();$('#n-q').setSelectionRange(p,p)};
    $('#n-new').onclick=()=>noteModal();
    $('#n-quick').onclick=()=>simpleModal('Quick capture',[{k:'b',label:'What is on your mind',type:'textarea'}],
      o=>{if(!o.b.trim()){return false}mut(()=>D.notes.unshift({id:uid(),title:o.b.trim().split('\n')[0].slice(0,44),
        body:o.b.trim(),type:'text',date:today()}));toast('Captured')});
    $$('[data-nedit]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-stop]'))return;noteModal(D.notes.find(n=>n.id===b.dataset.nedit))});
    $$('[data-ndel]').forEach(b=>b.onclick=e=>{e.stopPropagation();mut(()=>{D.notes=D.notes.filter(n=>n.id!==b.dataset.ndel)})});
    $$('[data-nitem]').forEach(b=>b.onclick=e=>{e.stopPropagation();mut(()=>{const n=D.notes.find(x=>x.id===b.dataset.nitem);
      n.items[+b.dataset.i].done=!n.items[+b.dataset.i].done})});
  }
};
let nq='';
function noteModal(nt){
  const n=nt||{id:null,type:'text',date:today()};
  const m=modal({title:nt?'Edit note':'New note',wide:true,confirm:'Save note',
    body:`${field('Title',`<input class="input" id="n-t" value="${esc(n.title||'')}">`)}
      ${field('Type',`<select class="select" id="n-ty">${[['text','Written note'],['checklist','Checklist']].map(([v,l])=>`<option value="${v}" ${n.type===v?'selected':''}>${l}</option>`).join('')}</select>`)}
      ${field('Content',`<textarea class="ta" id="n-b" style="min-height:220px" placeholder="Write freely. For a checklist, one item per line.">${n.type==='checklist'?(n.items||[]).map(i=>i.text).join('\n'):esc(n.body||'')}</textarea>`)}
      <label class="row sm"><input type="checkbox" id="n-p" ${n.pinned?'checked':''}> Pin to the top</label>
      ${nt?`<button class="btn ghost" id="n-del" style="color:var(--bad)">Delete this note</button>`:''}`,
    onConfirm:s=>{
      const body=$('#n-b',s).value,ty=$('#n-ty',s).value;
      if(!body.trim()&&!$('#n-t',s).value.trim()){toast('Add a title or some content');return false}
      const old=n.items||[];
      const o={id:n.id||uid(),title:$('#n-t',s).value.trim(),type:ty,body:ty==='text'?body:'',
        items:ty==='checklist'?body.split('\n').map(x=>x.trim()).filter(Boolean).map(t=>({text:t,done:!!(old.find(o2=>o2.text===t)||{}).done})):[],
        pinned:$('#n-p',s).checked,date:n.date||today()};
      mut(()=>{const i=D.notes.findIndex(x=>x.id===o.id);i>-1?D.notes[i]=o:D.notes.unshift(o);
        D.notes.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0))});
      toast('Note saved');
    }});
  $('#n-del',m.el)?.addEventListener('click',()=>{m.close();mut(()=>{D.notes=D.notes.filter(x=>x.id!==n.id)});toast('Note deleted')});
}
</script>
<script>
/* =====================================================================
   PAGE: FOCUS MODE
   ===================================================================== */
const F={mode:'work',left:null,run:false,tick:null,done:0,task:''};
function fMins(){return F.mode==='work'?D.settings.pomodoro:F.mode==='short'?D.settings.shortBreak:D.settings.longBreak}
function fReset(){F.run=false;clearInterval(F.tick);F.left=fMins()*60;paintTimer()}
function paintTimer(){
  const m=Math.floor(F.left/60),s=F.left%60,txt=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  $$('#f-time,#ff-time').forEach(e=>e&&(e.textContent=txt));
  $$('#f-toggle,#ff-toggle').forEach(e=>e&&(e.textContent=F.run?'Pause':F.left===fMins()*60?'Start':'Resume'));
  const r=$('#f-ring');if(r){const c=2*Math.PI*104;r.style.strokeDashoffset=c*(F.left/(fMins()*60))}
  document.title=F.run?`${txt} — ${D.settings.appName}`:`${D.settings.appName} — ${(PAGES[route]||{}).title||''}`;
}
function fStart(){
  if(F.run){F.run=false;clearInterval(F.tick);return paintTimer()}
  F.run=true;paintTimer();
  F.tick=setInterval(()=>{
    F.left--;
    if(F.left<=0){
      clearInterval(F.tick);F.run=false;
      if(F.mode==='work'){
        F.done++;
        D.focusLog.push({id:uid(),date:today(),mins:D.settings.pomodoro,task:F.task||null});
        checkBadges();save();
        F.mode=F.done%4===0?'long':'short';
        toast(`Session complete — ${F.mode==='long'?'take a longer break':'take a short break'}`);
      }else{F.mode='work';toast('Break over — ready when you are')}
      chime();notify('Timer finished',F.mode==='work'?'Back to it when you are ready':'Time for a break');
      F.left=fMins()*60;paintTimer();if(route==='focus')render();
      return;
    }
    paintTimer();
  },1000);
}
/* generated sounds — no files, works offline */
let AC=null,noiseNode=null,noiseGain=null,curSound=null;
function ensureAC(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();return AC}
function stopSound(){if(noiseNode){try{noiseNode.stop()}catch(e){}noiseNode=null}curSound=null;$$('[data-snd]').forEach(b=>b.classList.remove('on'))}
function playSound(kind){
  const ac=ensureAC();
  if(curSound===kind){stopSound();return}
  stopSound();curSound=kind;
  const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    if(kind==='white')d[i]=w*.4;
    else if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.2}
    else if(kind==='rain'){last=(last+.035*w)/1.035;d[i]=last*2.6+w*.06}
    else {last=(last+.01*w)/1.01;d[i]=last*4}
  }
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const f=ac.createBiquadFilter();f.type='lowpass';
  f.frequency.value=kind==='white'?9000:kind==='rain'?1400:kind==='brown'?600:340;
  noiseGain=ac.createGain();noiseGain.gain.value=0;
  src.connect(f);f.connect(noiseGain);noiseGain.connect(ac.destination);
  src.start();noiseGain.gain.linearRampToValueAtTime(.35,ac.currentTime+.8);
  noiseNode=src;
  $$('[data-snd]').forEach(b=>b.classList.toggle('on',b.dataset.snd===kind));
}
function chime(){
  try{const ac=ensureAC();[880,1108,1318].forEach((f,i)=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,ac.currentTime+i*.16);g.gain.linearRampToValueAtTime(.18,ac.currentTime+i*.16+.03);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.16+1.1);
    o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+i*.16);o.stop(ac.currentTime+i*.16+1.2)})}catch(e){}
}
PAGES.focus={
  title:'Focus mode',
  sub:()=>`${sum(D.focusLog.filter(f=>f.date===today()).map(f=>f.mins))} minutes focused today`,
  render(){
    if(F.left===null)F.left=fMins()*60;
    const c=2*Math.PI*104;
    const week=[...Array(7)].map((_,i)=>{const d=addDays(startOfWeek(today()),i);
      return{d,m:sum(D.focusLog.filter(f=>f.date===d).map(f=>f.mins))}});
    const maxM=Math.max(...week.map(w=>w.m),60);
    return `<div class="grid" style="grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)">
      <div class="card solid center" style="padding:34px 22px">
        <div class="tabs" style="justify-content:center;margin-bottom:22px">
          ${[['work',`Focus ${D.settings.pomodoro}m`],['short',`Short break ${D.settings.shortBreak}m`],['long',`Long break ${D.settings.longBreak}m`]].map(([k,l])=>
            `<button class="chip tab ${F.mode===k?'on':''}" data-fmode="${k}">${l}</button>`).join('')}
        </div>
        <div style="position:relative;width:232px;height:232px;margin:0 auto">
          <svg width="232" height="232" style="transform:rotate(-90deg)">
            <circle cx="116" cy="116" r="104" fill="none" stroke="var(--line)" stroke-width="10"/>
            <circle id="f-ring" cx="116" cy="116" r="104" fill="none" stroke="var(--accent)" stroke-width="10"
              stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(F.left/(fMins()*60))}"
              style="transition:stroke-dashoffset 1s linear"/></svg>
          <div style="position:absolute;inset:0;display:grid;place-items:center">
            <div><div class="display tnum" id="f-time" style="font-size:47px;font-weight:300">${String(Math.floor(F.left/60)).padStart(2,'0')}:${String(F.left%60).padStart(2,'0')}</div>
            <div class="eyebrow">${F.mode==='work'?'Focus':'Break'} · ${F.done} done</div></div></div>
        </div>
        <div class="row mt" style="justify-content:center;margin-top:24px">
          <button class="btn accent" id="f-toggle">${F.run?'Pause':'Start'}</button>
          <button class="btn" id="f-reset">Reset</button>
          <button class="btn ghost" id="f-full">⛶ Fullscreen</button>
        </div>
        <div style="max-width:340px;margin:22px auto 0">
          ${field('What are you working on',`<input class="input" id="f-task" value="${esc(F.task)}" placeholder="One thing only">`)}
        </div>
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-h"><h3>Background sound</h3></div>
          <div class="row wrap">${[['rain','🌧 Rain'],['brown','🌊 Brown noise'],['white','💨 White noise'],['deep','🫧 Deep hum']].map(([k,l])=>
            `<button class="chip tab ${curSound===k?'on':''}" data-snd="${k}">${l}</button>`).join('')}
            <button class="btn sm ghost" id="f-stopsnd">Stop</button></div>
          <div class="xs faint mt">Generated in your browser — nothing to download, works offline.</div>
        </div>
        <div class="card">
          <div class="card-h"><h3>This week</h3><span class="sp"></span><span class="chip">${sum(week.map(w=>w.m))} min</span></div>
          <div class="chart" style="height:120px">${week.map(w=>`<div><b style="height:${clamp(w.m/maxM*100,2,100)}%"></b>
            <span class="xs faint">${fmt(w.d,{weekday:'narrow'})}</span></div>`).join('')}</div>
        </div>
        <div class="card">
          <div class="card-h"><h3>Today's sessions</h3></div>
          ${D.focusLog.filter(f=>f.date===today()).length?`<div class="stack">${D.focusLog.filter(f=>f.date===today()).map(f=>`
            <div class="list-item"><div class="li-t">${esc(f.task||'Focus session')}</div><span class="chip xs">${f.mins} min</span></div>`).join('')}</div>`
            :`<div class="empty sm">No sessions yet today.</div>`}
        </div>
      </div></div>`;
  },
  after(){
    $$('[data-fmode]').forEach(b=>b.onclick=()=>{F.mode=b.dataset.fmode;fReset();render()});
    $('#f-toggle').onclick=fStart;
    $('#f-reset').onclick=()=>{fReset();render()};
    $('#f-full').onclick=()=>{$('#focus-full').classList.add('on');
      $('#ff-task').textContent=F.task||'Deep work';
      $('#ff-mode').textContent=F.mode==='work'?'Focus session':'Break';
      paintTimer();document.documentElement.requestFullscreen?.().catch(()=>{})};
    const ti=$('#f-task');if(ti)ti.oninput=()=>{F.task=ti.value};
    $$('[data-snd]').forEach(b=>b.onclick=()=>playSound(b.dataset.snd));
    $('#f-stopsnd').onclick=stopSound;
    paintTimer();
  }
};

/* =====================================================================
   PAGE: ASSISTANT — offline, rule-based planning help
   ===================================================================== */
const ROUTINES={
  morning:['Water before coffee','Ten minutes of movement','Write down the three things that matter today','Eat something with protein','Get dressed properly, even at home'],
  evening:['Kitchen reset — counters clear','Lay out tomorrow\'s clothes','Look at tomorrow\'s calendar once','Screens down thirty minutes before bed','One page of something you enjoy'],
  reset:['Ten-minute tidy in the room that bothers you most','One load of laundry, start to finish','Clear the inbox to fifty','Cancel one thing you dread','Drink two glasses of water'],
  workday:['Fifteen minutes of admin, then close email','One ninety-minute block on the hardest thing','Lunch away from the desk','Second block after lunch','Ten-minute shutdown ritual — write tomorrow\'s first task'],
};
const MEALIDEAS={
  breakfast:['Greek yogurt, berries, honey','Eggs and toast with spinach','Overnight oats with banana','Smoothie with peanut butter','Cottage cheese and tomato on rye'],
  lunch:['Chicken and rice bowl with cucumber','Big salad with tuna and white beans','Leftovers from last night','Turkey wrap with hummus','Soup and a grilled cheese'],
  dinner:['Sheet-pan salmon with broccoli','Lemon chicken with rice','Turkey chili','Pasta with garlic, greens and parmesan','Stir-fry with whatever is in the fridge','Tacos with black beans and slaw','Roast chicken thighs and potatoes'],
  snack:['Apple and almonds','Cheese and crackers','Handful of olives','Popcorn','Dark chocolate square'],
};
PAGES.assistant={
  title:'Assistant',
  sub:()=>'Planning help that runs entirely on your own data',
  render(){
    const out=aOut?`<div class="card solid" style="margin-bottom:18px;border-color:var(--accent)">
      <div class="card-h"><h3>${esc(aOut.title)}</h3><span class="sp"></span>
        <button class="btn sm ghost" id="a-clear">Clear</button></div>
      ${aOut.html}${aOut.apply?`<button class="btn accent mt" id="a-apply">${esc(aOut.applyLabel||'Add these to my plan')}</button>`:''}
    </div>`:'';
    const cards=[
      ['priorities','🌸','Suggest today\'s priorities','Looks at what is overdue, due today and highest priority, then picks three.'],
      ['breakdown','🎯','Break a goal into tasks','Turns a goal\'s milestones into dated tasks on your list.'],
      ['routine','☀️','Build a routine','Morning, evening, weekly reset or workday shutdown — added as repeating habits.'],
      ['meals','🍽','Generate a meal plan','Fills the coming week with balanced ideas, favouring recipes you saved.'],
      ['grocery','🛒','Create a grocery list','Pulls ingredients from this week\'s plan and your low pantry items.'],
      ['schedule','📅','Suggest a productive schedule','Blocks tomorrow around your existing appointments.'],
      ['summary','📊','Weekly productivity summary','Reads the last seven days and tells you what actually happened.'],
    ];
    return `<div class="card" style="margin-bottom:18px;background:color-mix(in srgb,var(--lav) 12%,transparent)">
      <div class="sm"><b>How this works:</b> everything here is generated from your own data inside your browser. There is no account to connect and no request leaves your device — which also means it is smart about your plan, not about the world.</div></div>
      ${out}
      <div class="grid g2">${cards.map(([k,i,t,d])=>`<button class="card hover" data-ai="${k}" style="text-align:left">
        <div class="row"><div style="font-size:26px">${i}</div><div style="flex:1">
          <h3 style="font-size:17px">${t}</h3><div class="sm muted" style="margin-top:3px">${d}</div></div>
          <div class="faint">→</div></div></button>`).join('')}</div>`;
  },
  after(){
    $('#a-clear')?.addEventListener('click',()=>{aOut=null;render()});
    $('#a-apply')?.addEventListener('click',()=>{const f=aOut.apply;aOut=null;f();});
    $$('[data-ai]').forEach(b=>b.onclick=()=>{ai(b.dataset.ai)});
  }
};
let aOut=null;
function ai(kind){
  const t=today();
  if(kind==='priorities'){
    const open=D.tasks.filter(x=>!taskDone(x));
    const scored=open.map(x=>({x,s:(x.due&&x.due<t?100:0)+(x.due===t?60:0)+({high:40,med:20,low:5})[x.prio||'low']+(x.subtasks?.length?5:0)}))
      .sort((a,b)=>b.s-a.s).slice(0,3);
    const hDue=D.habits.filter(h=>habitDue(h,t)&&!habitDone(h.id,t));
    aOut={title:'Your three for today',html:scored.length?`
      <div class="stack">${scored.map(({x},i)=>`<div class="list-item"><div class="display" style="font-size:21px;width:26px">${i+1}</div>
        <div style="flex:1"><div class="li-t">${esc(x.title)}</div>
        <div class="xs faint">${x.due?(x.due<t?'Overdue since '+fmt(x.due):relDay(x.due)):'No date'} · ${PRIOS[x.prio||'low'].l} priority</div></div></div>`).join('')}</div>
      ${hDue.length?`<div class="sm muted mt">Still open today: ${hDue.map(h=>esc(h.name)).join(', ')}.</div>`:''}
      <div class="sm muted mt">If you only do the first one, today still counts.</div>`
      :`<div class="sm muted">Nothing is competing for your attention. Pick one thing you have been putting off, or take the afternoon.</div>`};
  }
  if(kind==='breakdown'){
    const open=D.goals.filter(g=>!g.done);
    if(!open.length){aOut={title:'No goals to break down',html:'<div class="sm muted">Create a goal first, then come back and I will turn its milestones into dated tasks.</div>'};return render()}
    const g=open[0];const ms=(g.milestones||[]).filter(m=>!m.done);
    if(!ms.length){aOut={title:g.title,html:`<div class="sm muted">This goal has no open milestones. Edit the goal and add a few — even rough ones — and I will space them out for you.</div>`};return render()}
    const span=g.deadline?Math.max(Math.floor((parseISO(g.deadline)-parseISO(t))/864e5/ms.length),3):7;
    const plan=ms.map((m,i)=>({text:m.text,due:addDays(t,span*(i+1))}));
    aOut={title:`Plan for "${g.title}"`,html:`<div class="stack">${plan.map(p=>`<div class="list-item">
        <div class="li-t">${esc(p.text)}</div><span class="chip xs">${fmt(p.due,{month:'short',day:'numeric'})}</span></div>`).join('')}</div>
      <div class="sm muted mt">Spaced roughly ${span} days apart${g.deadline?` to land by ${fmt(g.deadline,{month:'long',day:'numeric'})}`:''}.</div>`,
      applyLabel:'Add these tasks to my list',
      apply:()=>{mut(()=>plan.forEach(p=>D.tasks.unshift({id:uid(),title:p.text,due:p.due,date:p.due,prio:'med',
        cat:D.categories[0].id,repeat:'none',status:'todo',subtasks:[],list:g.title,notes:`Step toward: ${g.title}`,created:t})));
        toast(`${plan.length} tasks added`)}};
  }
  if(kind==='routine'){
    return modal({title:'Build a routine',body:field('Which routine',
      `<select class="select" id="r-k">${Object.keys(ROUTINES).map(k=>`<option value="${k}">${k[0].toUpperCase()+k.slice(1)} routine</option>`).join('')}</select>`),
      confirm:'Preview',onConfirm:s=>{
        const k=$('#r-k',s).value,steps=ROUTINES[k];
        aOut={title:`${k[0].toUpperCase()+k.slice(1)} routine`,html:`<div class="stack">${steps.map(x=>`<div class="list-item"><div class="li-t">${esc(x)}</div></div>`).join('')}</div>
          <div class="sm muted mt">Add all five, or start with two. Two you actually do beats five you resent.</div>`,
          applyLabel:'Add as daily habits',
          apply:()=>{mut(()=>steps.forEach(x=>D.habits.push({id:uid(),name:x,icon:k==='evening'?'🌙':k==='morning'?'☀️':'✨',
            freq:k==='reset'?'weekly':'daily',days:[],anchor:6,created:t,why:`Part of my ${k} routine`})));toast('Routine added to your habits')}};
        render();
      }});
  }
  if(kind==='meals'){
    const s=startOfWeek(t),plan={};
    const pool=k=>{const saved=D.recipes.map(r=>r.name);return k==='dinner'&&saved.length?[...saved,...MEALIDEAS.dinner]:MEALIDEAS[k]};
    [...Array(7)].forEach((_,i)=>{const d=addDays(s,i);plan[d]={};
      SLOTS.forEach(([k])=>{if(k==='snack'&&i%2)return;const p=pool(k);plan[d][k]=p[(i*3+k.length)%p.length]})});
    aOut={title:'A week of meals',html:`<div class="stack">${Object.keys(plan).map(d=>`<div class="list-item" style="flex-direction:column;align-items:flex-start;gap:3px">
        <div class="eyebrow">${fmt(d,{weekday:'long'})}</div>
        <div class="sm">${SLOTS.filter(([k])=>plan[d][k]).map(([k,l])=>`<b>${l}:</b> ${esc(plan[d][k])}`).join(' · ')}</div></div>`).join('')}</div>
      <div class="sm muted mt">Balanced but not precious — swap anything you don't feel like.</div>`,
      applyLabel:'Put this in my meal planner',
      apply:()=>{mut(()=>{Object.keys(plan).forEach(d=>{D.meals[d]={...(D.meals[d]||{}),...plan[d]}});checkBadges()});
        tab.meals='week';go('meals');toast('Week planned')}};
  }
  if(kind==='grocery'){
    const s=startOfWeek(t),items=new Set();
    [...Array(7)].forEach((_,i)=>{const m=D.meals[addDays(s,i)]||{};
      Object.values(m).forEach(v=>{if(!v)return;const r=D.recipes.find(x=>x.name.toLowerCase()===v.toLowerCase());
        if(r?.ingredients)r.ingredients.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>items.add(x));
        else items.add(`Ingredients for ${v}`)})});
    D.pantry.filter(p=>p.low).forEach(p=>items.add(p.name));
    const arr=[...items];
    aOut={title:'Grocery list from your plan',html:arr.length?`<div class="stack">${arr.map(x=>`<div class="list-item"><div class="li-t">${esc(x)}</div></div>`).join('')}</div>`
      :'<div class="sm muted">Plan some meals or mark pantry items as low, then I will have something to work with.</div>',
      applyLabel:arr.length?'Add to grocery list':null,
      apply:arr.length?()=>{mut(()=>arr.forEach(x=>{if(!D.grocery.some(g=>!g.done&&g.name===x))D.grocery.push({id:uid(),name:x,aisle:'From my plan',done:false})}));
        tab.meals='grocery';go('meals');toast('Grocery list updated')}:null};
  }
  if(kind==='schedule'){
    const d=addDays(t,1),busy=eventsOn(d).filter(e=>!e.allDay).map(e=>[toMin(e.start),toMin(e.end||e.start)+30]);
    const free=[];let cur=8*60;
    while(cur<19*60){const end=cur+90;
      if(!busy.some(([a,b])=>cur<b&&end>a))free.push([cur,end]);
      cur+=90}
    const top=D.tasks.filter(x=>!taskDone(x)).sort((a,b)=>({high:0,med:1,low:2})[a.prio||'low']-({high:0,med:1,low:2})[b.prio||'low']);
    const blocks=free.slice(0,4).map(([a,b],i)=>({start:hhmm(a),end:hhmm(b),
      title:i===0?(top[0]?`Deep work — ${top[0].title}`:'Deep work'):i===1?(top[1]?top[1].title:'Second block'):i===2?'Admin and email':'Movement or rest'}));
    aOut={title:`A shape for ${relDay(d)}`,html:blocks.length?`<div class="stack">${blocks.map(b=>`<div class="list-item">
        <span class="chip xs tnum">${t12(b.start)}–${t12(b.end)}</span><div class="li-t">${esc(b.title)}</div></div>`).join('')}</div>
      <div class="sm muted mt">Built around the ${eventsOn(d).length} thing${eventsOn(d).length===1?'':'s'} already on your calendar. Three blocks is a full day — do not add a fourth out of guilt.</div>`
      :'<div class="sm muted">Tomorrow is already full. That is a schedule too.</div>',
      applyLabel:blocks.length?'Add these blocks to my calendar':null,
      apply:blocks.length?()=>{mut(()=>blocks.forEach(b=>D.events.push({id:uid(),title:b.title,date:d,start:b.start,end:b.end,
        cat:D.categories[0].id,repeat:'none',allDay:false,notes:'Time block'})));calState.date=d;calState.view='day';go('calendar');toast('Blocks added')}:null};
  }
  if(kind==='summary'){
    const days=[...Array(7)].map((_,i)=>addDays(t,-6+i));
    const tDone=D.tasks.filter(x=>x.doneAt&&x.doneAt.slice(0,10)>=days[0]).length;
    const hRate=Math.round(sum(D.habits.map(h=>successRate(h,7)))/Math.max(D.habits.length,1));
    const mins=sum(D.focusLog.filter(f=>f.date>=days[0]).map(f=>f.mins));
    const jn=D.journal.filter(j=>j.date>=days[0]).length;
    const wAvg=Math.round(sum(days.map(d=>D.water[d]||0))/7*10)/10;
    const moods=days.map(d=>D.moods[d]).filter(Boolean);
    const mAvg=moods.length?(sum(moods)/moods.length).toFixed(1):null;
    const spend=sum(D.expenses.filter(x=>x.date>=days[0]).map(x=>x.amount));
    const best=days.map(d=>({d,v:productivityScore(d)})).sort((a,b)=>b.v-a.v)[0];
    const lines=[];
    lines.push(`You closed <b>${tDone}</b> task${tDone===1?'':'s'} and kept your habits <b>${hRate}%</b> of the time.`);
    if(mins)lines.push(`You focused for <b>${Math.round(mins/60*10)/10} hours</b> across ${D.focusLog.filter(f=>f.date>=days[0]).length} sessions.`);
    lines.push(`Water averaged <b>${wAvg}</b> glasses a day${wAvg<D.settings.waterGoal*.7?' — the easiest thing on this list to fix':''}.`);
    if(mAvg)lines.push(`Mood averaged <b>${mAvg} of 5</b>${+mAvg>=4?', which is worth noticing':''}.`);
    if(jn)lines.push(`You wrote <b>${jn}</b> journal entr${jn===1?'y':'ies'}.`);
    if(spend)lines.push(`You spent <b>${money(spend)}</b>.`);
    lines.push(`Your strongest day was <b>${fmt(best.d,{weekday:'long'})}</b> at ${best.v}. Whatever you did differently, do it again.`);
    aOut={title:'Your week',html:`<div class="stack">${lines.map(l=>`<div class="sm">🌸 ${l}</div>`).join('')}</div>
      <div class="chart mt">${days.map(d=>`<div><b style="height:${clamp(productivityScore(d),3,100)}%"></b>
        <span class="xs faint">${fmt(d,{weekday:'narrow'})}</span></div>`).join('')}</div>`};
  }
  render();
}

function exportBackup(){
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`${D.settings.appName.toLowerCase().replace(/\s+/g,'-')}-backup-${today()}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Backup saved to your downloads');
}
function importBackup(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const p=JSON.parse(r.result);
    if(!p||typeof p!=='object'||!('tasks'in p||'settings'in p))throw 0;
    confirmDialog('Replace current data?','Your backup will overwrite everything currently in this browser.',()=>{
      D=deepFill(p,structuredClone(SEED));save();applyTheme();go(D.settings.homepage||'dashboard');toast('Backup restored')},'Restore it');
  }catch(e){toast('That file is not a valid backup')}};
  r.readAsText(file);
}
function exportCSV(){
  const rows=[['Type','Name','Date','Detail','Amount','Status']];
  D.tasks.forEach(t=>rows.push(['Task',t.title,t.due||'',PRIOS[t.prio||'low'].l+' / '+catName(t.cat),'',taskDone(t)?'Done':'Open']));
  D.events.forEach(e=>rows.push(['Event',e.title,e.date,(e.allDay?'All day':`${e.start}-${e.end||''}`)+' / '+catName(e.cat),'','']));
  D.habits.forEach(h=>rows.push(['Habit',h.name,'',h.freq,streak(h),'streak days']));
  D.goals.forEach(g=>rows.push(['Goal',g.title,g.deadline||'',g.area,goalPct(g)+'%',g.done?'Complete':'In progress']));
  D.expenses.forEach(x=>rows.push(['Expense',x.name,x.date,x.cat||'',x.amount,'']));
  D.income.forEach(x=>rows.push(['Income',x.name,x.date,x.cat||'',x.amount,'']));
  D.bills.forEach(b=>rows.push(['Bill',b.name,'Day '+b.due,b.auto?'Autopay':'Manual',b.amount,b.paid?'Paid':'Due']));
  D.subs.forEach(s=>rows.push(['Subscription',s.name,s.renew||'',s.cycle,s.amount,'']));
  D.workouts.forEach(w=>rows.push(['Workout',w.type,w.date,w.how||'',w.mins,'minutes']));
  D.journal.forEach(j=>rows.push(['Journal',j.title||'Entry',j.date,j.type,'','']));
  const csv=rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=`${D.settings.appName.toLowerCase()}-export-${today()}.csv`;a.click();toast('CSV exported');
}

function applyTheme(){
  const s=D.settings;
  document.documentElement.dataset.theme=s.theme==='dark'?'dark':'light';
  const map={blush:['--blush','--blush-deep'],sage:['--sage','--sage-deep'],lav:['--lav','--lav-deep'],
    peach:['--peach','--peach'],ink:['--ink-soft','--ink']};
  const root=document.documentElement.style;
  if(s.accent==='custom'&&s.customAccent){root.setProperty('--accent',s.customAccent);root.setProperty('--accent-deep',s.customAccent)}
  else{const [a,b]=map[s.accent]||map.blush;root.setProperty('--accent',`var(${a})`);root.setProperty('--accent-deep',`var(${b})`)}
  const tb=$('#theme-btn');if(tb)tb.innerHTML=s.theme==='dark'?'☀️ <span class="lbl">Light</span>':'🌙 <span class="lbl">Dark</span>';
  $('meta[name=theme-color]').setAttribute('content',s.theme==='dark'?'#191521':'#FBF7F1');
}
function notify(title,body){
  if(typeof Notification==='undefined'||Notification.permission!=='granted'||!D.settings.reminders)return;
  try{new Notification(title,{body,icon:iconURL(192)})}catch(e){}
}
const fired=new Set();
setInterval(()=>{
  if(!D.settings.reminders)return;
  const now=new Date(),t=today(),hm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  eventsOn(t).forEach(e=>{
    if(e.remind==null||e.allDay)return;
    const at=hhmm(clamp(toMin(e.start)-e.remind,0,1439)),key=t+e.id+at;
    if(at===hm&&!fired.has(key)){fired.add(key);notify(e.title,e.remind?`Starts in ${e.remind} minutes`:'Starting now');chime()}
  });
  D.habits.forEach(h=>{
    if(!h.remind||!habitDue(h,t)||habitDone(h.id,t))return;
    const key=t+h.id;if(h.remind===hm&&!fired.has(key)){fired.add(key);notify(h.name,'Time for this one')}
  });
},30000);

/* icons + manifest generated at runtime, so the file stays self-contained */
function drawIcon(size){
  const c=document.createElement('canvas');c.width=c.height=size;
  const x=c.getContext('2d'),h=size/2,s=size/100;
  x.fillStyle='#FBF7F1';x.beginPath();
  if(x.roundRect)x.roundRect(0,0,size,size,22*s);else x.rect(0,0,size,size);
  x.fill();
  const cols=['#DFA8AE','#C88A92','#B0A5D4','#8CA383','#EFC7AE','#DFA8AE'];
  cols.forEach((col,i)=>{
    x.save();x.translate(h,h);x.rotate(i*Math.PI/3);x.globalAlpha=.78;
    x.fillStyle=col;x.beginPath();x.ellipse(0,-22*s,13*s,21*s,0,0,Math.PI*2);x.fill();x.restore();
  });
  x.globalAlpha=1;x.fillStyle='#6F8768';x.beginPath();x.arc(h,h,9*s,0,Math.PI*2);x.fill();
  return c.toDataURL('image/png');
}
function iconURL(size){try{return drawIcon(size)}catch(e){return ''}}
